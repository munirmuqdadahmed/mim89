<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تتبع طلبك المباشر - MIM89 FAST FOOD</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- مكتبات الفايربيس -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --gold-primary: #f59e0b;
            --gold-bright: #fbbf24;
            --bg-dark: #070709;
            --card-bg: #121217;
            --card-border: rgba(245, 158, 11, 0.22);
            --text-main: #f3f4f6;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Tajawal', sans-serif;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .track-card {
            background: var(--card-bg);
            border: 1px solid var(--gold-primary);
            border-radius: 18px;
            padding: 24px 18px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
            text-align: center;
        }

        .gold-input {
            background: #181820;
            border: 1px solid #333;
            color: #fff;
            width: 100%;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            margin-bottom: 10px;
        }

        .gold-input:focus {
            border-color: var(--gold-primary);
        }

        .gold-btn {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-bright));
            color: #000;
            border: none;
            padding: 12px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(245,158,11,0.4);
            transition: transform 0.2s;
        }

        .gold-btn:active {
            transform: scale(0.97);
        }

        .tracking-stepper {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 25px 0;
        }

        .tracking-stepper::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 10%;
            right: 10%;
            height: 4px;
            background: #282835;
            z-index: 1;
        }

        .tracking-progress-bar {
            position: absolute;
            top: 20px;
            right: 10%;
            height: 4px;
            background: var(--gold-primary);
            z-index: 2;
            transition: width 0.4s ease;
        }

        .step-item {
            position: relative;
            z-index: 3;
            text-align: center;
            flex: 1;
        }

        .step-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #181822;
            border: 2px solid #333;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 6px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .step-item.active .step-icon {
            background: var(--gold-primary);
            color: #000;
            border-color: var(--gold-bright);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
        }

        .step-item.completed .step-icon {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }

        .step-label {
            font-size: 0.72rem;
            font-weight: 800;
            color: #aaa;
        }

        .step-item.active .step-label { color: var(--gold-bright); }
        .step-item.completed .step-label { color: var(--success); }
    </style>
</head>
<body>

    <div class="track-card">
        <h2 style="color:var(--gold-bright); margin-bottom:4px; font-weight:900;">
            <i class="fa-solid fa-fire-flame-curry" style="color:var(--gold-primary);"></i> MIM89 FAST FOOD
        </h2>
        <p style="color:#aaa; font-size:0.85rem; margin-bottom:16px;">خدمة تتبع حالة الطلب المباشر</p>

        <div style="display:flex; gap:6px; margin-bottom:14px;">
            <input type="text" id="orderIdInput" class="gold-input" placeholder="أدخل رقم الطلب (مثلاً: MIM-1234)..." style="margin-bottom:0;">
            <button onclick="searchAndTrackOrder()" class="gold-btn" style="width:auto; padding:0 20px;">تتبع</button>
        </div>

        <div id="trackingResultBox" style="display:none;">
            <div style="background:#181822; padding:10px; border-radius:10px; border:1px solid var(--gold-primary); margin-bottom:12px;">
                <span style="font-size:0.75rem; color:#aaa;">رقم الطلب المباشر:</span>
                <h3 id="displayOrderId" style="color:var(--gold-bright); letter-spacing:1px; margin-top:2px;">MIM-0000</h3>
            </div>

            <!-- شريط مراحل التتبع اللحظي -->
            <div class="tracking-stepper">
                <div id="trackProgressBar" class="tracking-progress-bar" style="width: 0%;"></div>

                <div id="step1" class="step-item active">
                    <div class="step-icon"><i class="fa-solid fa-paper-plane"></i></div>
                    <div class="step-label">تم الإرسال</div>
                </div>

                <div id="step2" class="step-item">
                    <div class="step-icon"><i class="fa-solid fa-fire-burner"></i></div>
                    <div class="step-label">بالتحضير</div>
                </div>

                <div id="step3" class="step-item">
                    <div class="step-icon"><i class="fa-solid fa-motorcycle"></i></div>
                    <div class="step-label">بالتوصيل</div>
                </div>

                <div id="step4" class="step-item">
                    <div class="step-icon"><i class="fa-solid fa-check"></i></div>
                    <div class="step-label">تم التسليم</div>
                </div>
            </div>

            <div id="trackStatusMsg" style="background:#161622; padding:12px; border-radius:10px; font-size:0.85rem; color:#fff; margin-bottom:14px; border:1px solid #2a2a35; line-height:1.5;">
                جاري البحث عن حالة الطلب...
            </div>

            <a id="whatsappHelpBtn" href="https://api.whatsapp.com/send?phone=9647750008630" target="_blank" class="gold-btn" style="background:#25D366; color:#fff; text-decoration:none; display:inline-flex; justify-content:center; align-items:center; gap:8px;">
                <i class="fa-brands fa-whatsapp" style="font-size:1.2rem;"></i> مراسلة الكاشير المباشر
            </a>
        </div>
    </div>

    <!-- ربط محرك النظام الرئيسي -->
    <script src="app.js"></script>
    <script>
        let unsubscribeFunc = null;

        function updateTrackingUI(statusText) {
            const s1 = document.getElementById('step1');
            const s2 = document.getElementById('step2');
            const s3 = document.getElementById('step3');
            const s4 = document.getElementById('step4');
            const bar = document.getElementById('trackProgressBar');
            const msg = document.getElementById('trackStatusMsg');

            s1.className = 'step-item completed';
            s2.className = 'step-item';
            s3.className = 'step-item';
            s4.className = 'step-item';

            if (statusText === 'جديد' || statusText === 'قيد الانتظار') {
                bar.style.width = '0%';
                if (msg) msg.innerHTML = '📥 <strong>تم استلام طلبكم بنجاح!</strong> الطلب الآن في قائمة الانتظار لدى الكاشير.';
            } else if (statusText === 'قيد التحضير' || statusText === 'بالمطبخ') {
                s2.className = 'step-item active';
                bar.style.width = '33%';
                if (msg) msg.innerHTML = '🍳 <strong>طلبكم قيد التحضير والتجهيز بالمطبخ الآن!</strong>';
            } else if (statusText === 'خرج للتوصيل' || statusText === 'مع السائق') {
                s2.className = 'step-item completed';
                s3.className = 'step-item active';
                bar.style.width = '66%';
                if (msg) msg.innerHTML = '🛵 <strong>خرج الطلب مع سائق التوصيل وهو في الطريق إليكم!</strong>';
            } else if (statusText === 'تم التسليم' || statusText === 'مكتمل') {
                s2.className = 'step-item completed';
                s3.className = 'step-item completed';
                s4.className = 'step-item completed';
                bar.style.width = '100%';
                if (msg) msg.innerHTML = '🎉 <strong>تم تسليم الطلب بنجاح!</strong> شكرًا لطلبكم من MIM89 FAST FOOD ❤️';
            } else if (statusText === 'ملغى') {
                bar.style.width = '0%';
                if (msg) msg.innerHTML = '❌ <strong>نعتذر منك، تم إلغاء الطلب من قبل إدارة المطعم.</strong>';
            }
        }

        function searchAndTrackOrder() {
            const orderId = document.getElementById('orderIdInput').value.trim();
            if (!orderId) {
                alert("يرجى كتابة رقم الطلب!");
                return;
            }

            document.getElementById('displayOrderId').innerText = orderId;
            document.getElementById('trackingResultBox').style.display = 'block';

            if (unsubscribeFunc) unsubscribeFunc();

            if (typeof db !== 'undefined' && db) {
                unsubscribeFunc = db.collection('orders').where('orderId', '==', orderId).onSnapshot(snapshot => {
                    if (!snapshot.empty) {
                        const docData = snapshot.docs[0].data();
                        updateTrackingUI(docData.status || 'جديد');
                    } else {
                        document.getElementById('trackStatusMsg').innerHTML = '⚠️ لم نجد هذا الطلب في النظام، يرجى التأكد من الرقم المكتوب.';
                    }
                }, err => {
                    console.warn("Firestore listener error:", err);
                });
            } else {
                updateTrackingUI('جديد');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const orderIdParam = urlParams.get('orderId');
            if (orderIdParam) {
                document.getElementById('orderIdInput').value = orderIdParam;
                searchAndTrackOrder();
            }
        });
    </script>
</body>
</html>
