<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM89 FAST FOOD - إدارة المخزن والسرقات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body onload="initInventoryPage()">

    <!-- نافذة رمز دخول المخزن -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <div class="brand-badge">MIM89</div>
            <h2 style="color:var(--gold-primary); margin:10px 0;"><i class="fa-solid fa-boxes-stacked"></i> دخول مسئول المخزن</h2>
            <div class="form-group">
                <label>رمز مرور المخزن:</label>
                <input type="password" id="invPassInput" class="gold-input" placeholder="أدخل كلمة السر">
            </div>
            <button onclick="loginInventory()" class="gold-btn btn-block">دخول المخزن</button>
            <p id="authError" class="error-msg"></p>
        </div>
    </div>

    <div id="invMainApp" class="container" style="display:none; padding:20px;">
        <header class="admin-header">
            <h1 style="color:var(--gold-primary);"><i class="fa-solid fa-warehouse"></i> إدارة الجرد التفصيلي للمواد الخام</h1>
            <button onclick="location.reload()" class="gold-btn" style="background:#ef4444; color:#fff;">خروج</button>
        </header>

        <div class="card" style="margin-bottom:20px;">
            <h3 style="color:var(--gold-primary);">إضافة مادة خام جديدة للجرد</h3>
            <div class="form-grid" style="margin-top:10px;">
                <input type="text" id="newInvName" class="gold-input" placeholder="اسم المادة (مثال: صدور دجاج طازجة)">
                <input type="number" id="newInvQty" class="gold-input" placeholder="الكمية المتاحة حالياً">
                <input type="text" id="newInvUnit" class="gold-input" placeholder="الوحدة (كغم، قطع، علبة)">
                <button onclick="addNewInventoryItem()" class="gold-btn">إضافة للمخزن</button>
            </div>
        </div>

        <div class="card">
            <h3 style="color:var(--gold-primary);">كميات مواد المخزن الحالية (يخصم منها النظام آلياً فور التجهيز)</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>المادة</th>
                        <th>الكمية المتبقية</th>
                        <th>الوحدة</th>
                        <th>التحكم</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
