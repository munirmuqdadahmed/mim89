<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIM89 FAST FOOD - القائمة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #111; color: #fff; padding-bottom: 70px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #1a1a1a; border-bottom: 1px solid #222; }
        .brand-box { text-align: right; }
        .brand-box h1 { color: #ff9f00; font-size: 22px; font-weight: 900; letter-spacing: 1px; line-height: 1.1; }
        .brand-box span { color: #aaa; font-size: 11px; font-weight: bold; display: block; }

        .search-container { padding: 12px 15px; background: #151515; display: flex; gap: 8px; }
        .search-box { background: #222; border: 1px solid #333; border-radius: 10px; display: flex; align-items: center; padding: 8px 12px; flex: 1; }
        .search-box i { color: #777; margin-left: 8px; }
        .search-box input { background: transparent; border: none; color: #fff; width: 100%; outline: none; font-size: 13px; font-family: 'Cairo'; }
        .reset-btn { background: #333; color: #ff9f00; border: 1px solid #ff9f00; border-radius: 10px; padding: 0 12px; cursor: pointer; font-size: 12px; }

        .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding: 12px 15px; background: #151515; white-space: nowrap; border-bottom: 1px solid #222; }
        .cat-btn { background: #222; color: #ff9f00; border: 1px solid #ff9f00; padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; font-weight: bold; }
        .cat-btn.active { background: #ff9f00; color: #000; }

        .menu-section { padding: 15px; }
        .section-title { color: #ff9f00; font-size: 16px; font-weight: 900; margin: 15px 0 10px 0; border-bottom: 1px solid #222; padding-bottom: 6px; }
        
        .item-card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; overflow: hidden; margin-bottom: 15px; display: flex; flex-direction: column; }
        .item-img { width: 100%; height: 150px; object-fit: cover; }
        .item-details { padding: 12px; }
        .item-title { font-size: 15px; font-weight: bold; margin-bottom: 4px; color: #fff; }
        .item-desc { font-size: 11px; color: #aaa; margin-bottom: 10px; line-height: 1.4; }
        .item-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #252525; padding-top: 8px; }
        .item-price { color: #ff9f00; font-size: 15px; font-weight: 900; }
        .add-btn { background: #ff9f00; color: #000; border: none; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        /* شريط التنقل السفلي */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #181818; border-top: 1px solid #333; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
        .nav-item { color: #aaa; text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; background: none; border: none; font-family: 'Cairo'; }
        .nav-item i { font-size: 16px; }
        .nav-item.active { color: #ff9f00; }
        
        .nav-item.center-cart-btn { background: #ff9f00; color: #000; width: 45px; height: 45px; border-radius: 50%; justify-content: center; margin-top: -18px; border: 3px solid #111; font-size: 18px; position: relative; display: flex; align-items: center; }
        .cart-badge { position: absolute; top: -2px; right: -2px; background: #e63946; color: #fff; font-size: 9px; width: 17px; height: 17px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: flex-end; flex-direction: column; }
        .modal-content { background: #1a1a1a; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; max-height: 85vh; overflow-y: auto; text-align: right; }
        .cart-row { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
        .checkout-input { width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 9px; border-radius: 8px; margin-bottom: 8px; font-family: 'Cairo'; font-size: 13px; }
        
        .center-modal { justify-content: center; align-items: center; }
        .center-box { border-radius: 15px; width: 90%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="brand-box">
            <h1>MIM89 FAST FOOD</h1>
            <span>FAST FOOD</span>
        </div>
        <div style="color:#ff9f00; font-size:12px; font-weight:bold;"><i class="fas fa-store"></i> التوصيل السريع</div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن أي صنف..." oninput="filterMenu()">
        </div>
        <button class="reset-btn" onclick="resetMenuCache()" title="إعادة ضبط القائمة">🔄</button>
    </div>

    <div class="categories-bar" id="categoriesBar"></div>

    <div class="menu-section" id="menuContainer"></div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="window.scrollTo({top:0, behavior:'smooth'})"><i class="fas fa-home"></i>الرئيسية</button>
        <button class="nav-item" onclick="showOffersModal()"><i class="fas fa-fire"></i>العروض</button>
        
        <button class="nav-item center-cart-btn" onclick="openCartModal()">
            <i class="fas fa-shopping-cart"></i>
            <div class="cart-badge" id="cartCount">0</div>
        </button>

        <button class="nav-item" onclick="showLocationModal()"><i class="fas fa-map-marker-alt"></i>الموقع</button>
        <button class="nav-item" onclick="showMoreModal()"><i class="fas fa-bars"></i>المزيد</button>
    </div>

    <div id="cartModal" class="modal">
        <div class="modal-content">
            <h3 style="color:#ff9f00; margin-bottom:12px; text-align:center;">🛒 سلة الطلبات</h3>
            <div id="cartItemsList"></div>
            <div style="margin-top:15px; border-top:1px solid #333; padding-top:10px;">
                <input type="text" id="custName" class="checkout-input" placeholder="اسم الزبون الكريم">
                <input type="tel" id="custPhone" class="checkout-input" placeholder="رقم الهاتف">
                <input type="text" id="custAddress" class="checkout-input" placeholder="العنوان بالتفصيل">
                <textarea id="custNotes" class="checkout-input" placeholder="ملاحظات إضافية (اختياري)" style="height:50px;"></textarea>
                <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:bold; margin:10px 0;">
                    <span>الإجمالي الكلي:</span>
                    <span id="cartTotal" style="color:#ff9f00;">0 د.ع</span>
                </div>
                <button style="width:100%; background:#25d366; color:#fff; border:none; padding:11px; border-radius:10px; font-weight:bold; font-size:14px; cursor:pointer;" onclick="sendOrderToWhatsApp()">إرسال الطلب عبر الواتساب 📱</button>
                <button style="width:100%; background:#444; color:#fff; border:none; padding:9px; border-radius:10px; font-weight:bold; font-size:12px; cursor:pointer; margin-top:6px;" onclick="closeCartModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <div id="infoModal" class="modal center-modal" onclick="closeInfoModal()">
        <div class="modal-content center-box" onclick="event.stopPropagation()">
            <h3 id="infoTitle" style="color:#ff9f00; margin-bottom:10px;"></h3>
            <p id="infoText" style="font-size:13px; color:#ddd; line-height:1.6; margin-bottom:15px;"></p>
            <button style="background:#ff9f00; color:#000; border:none; padding:8px 20px; border-radius:8px; font-weight:bold; width:100%;" onclick="closeInfoModal()">حسناً</button>
        </div>
    </div>

<script>
    const baseMenuItems = [
        { id: 401, cat: "🌯 قسم الشاورما", name: "شاورما صاج دجاج (عادي)", desc: "ثومية، مخلل، خبز صاج، بطاطا", price: "1,500 د.ع", img: "https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=500&auto=format&fit=crop&q=60" },
        { id: 402, cat: "🌯 قسم الشاورما", name: "شاورما صاج دجاج (دبل)", desc: "كمية مضاعفة من الشاورما مع الثومية والصوص", price: "3,000 د.ع", img: "https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=500&auto=format&fit=crop&q=60" },
        { id: 201, cat: "🍔 قسم البركر", name: "بركر كلاسيك لحم", desc: "لحم طازج مع الصوص الخاص والخضار مع فنكر", price: "4,000 د.ع", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&auto=format&fit=crop&q=60" }
    ];

    let menuItems = baseMenuItems;
    let cart = [];

    function loadMenuData() {
        const saved = localStorage.getItem('mim89_custom_menu');
        if (saved) {
            try {
                let parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    menuItems = parsed;
                } else {
                    menuItems = baseMenuItems;
                }
            } catch (e) {
                menuItems = baseMenuItems;
            }
        } else {
            menuItems = baseMenuItems;
        }
    }

    function resetMenuCache() {
        localStorage.removeItem('mim89_custom_menu');
        menuItems = baseMenuItems;
        renderCategories();
        renderMenu(menuItems);
        alert("🔄 تم تحديث وإعادة ضبط القائمة بنجاح!");
    }

    function renderMenu(items) {
        const container = document.getElementById('menuContainer');
        if (!items || items.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#777; margin-top:20px;">عذراً، لا توجد أصناف.</p>';
            return;
        }

        let html = '';
        let cats = [...new Set(items.map(i => i.cat))];
        cats.forEach(cat => {
            html += `<div class="section-title">${cat}</div>`;
            items.filter(i => i.cat === cat).forEach(item => {
                html += `
                    <div class="item-card">
                        <img src="${item.img}" class="item-img" onerror="this.src='https://via.placeholder.com/300x150/222/ff9f00?text=MIM89';">
                        <div class="item-details">
                            <div class="item-title">${item.name}</div>
                            <div class="item-desc">${item.desc || 'وجبة طازجة ومميزة'}</div>
                            <div class="item-footer">
                                <span class="item-price">${item.price}</span>
                                <button class="add-btn" onclick="addToCart('${item.name.replace(/'/g, "")}', '${item.price}')"><i class="fas fa-cart-plus"></i> إضافة</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        });
        container.innerHTML = html;
    }

    function renderCategories() {
        const bar = document.getElementById('categoriesBar');
        const cats = ['الكل', ...new Set(menuItems.map(i => i.cat))];
        bar.innerHTML = cats.map(c => `<button class="cat-btn ${c==='الكل'?'active':''}" onclick="filterCat('${c}', this)">${c}</button>`).join('');
    }

    function filterCat(cat, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (cat === 'الكل') {
            renderMenu(menuItems);
        } else {
            renderMenu(menuItems.filter(i => i.cat === cat));
        }
    }

    function filterMenu() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = menuItems.filter(i => i.name.toLowerCase().includes(query) || (i.desc && i.desc.toLowerCase().includes(query)));
        renderMenu(filtered);
    }

    // تمت إزالة الرسالة المنبثقة تماماً لتتم الإضافة بصمت وسلاسة
    function addToCart(name, priceStr) {
        const price = parseInt(priceStr.replace(/[^0-9]/g, '')) || 0;
        const found = cart.find(i => i.name === name);
        if (found) {
            found.qty += 1;
        } else {
            cart.push({ name, price, qty: 1 });
        }
        updateCartUI();
    }

    function updateCartUI() {
        const totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
        document.getElementById('cartCount').innerText = totalQty;
        
        const list = document.getElementById('cartItemsList');
        if (cart.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#777;">السلة فارغة</p>';
            document.getElementById('cartTotal').innerText = '0 د.ع';
            return;
        }

        let total = 0;
        list.innerHTML = cart.map((item, idx) => {
            let sum = item.price * item.qty;
            total += sum;
            return `
                <div class="cart-row">
                    <div><b>${item.name}</b><br><small>${item.price.toLocaleString()} × ${item.qty}</small></div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span>${sum.toLocaleString()} د.ع</span>
                        <button onclick="changeCartQty(${idx}, 1)" style="background:#ff9f00; border:none; padding:2px 6px; border-radius:4px; font-weight:bold;">+</button>
                        <button onclick="changeCartQty(${idx}, -1)" style="background:#e63946; color:#fff; border:none; padding:2px 6px; border-radius:4px; font-weight:bold;">-</button>
                    </div>
                </div>
            `;
        }).join('');
        document.getElementById('cartTotal').innerText = total.toLocaleString() + ' د.ع';
    }

    function changeCartQty(idx, delta) {
        cart[idx].qty += delta;
        if (cart[idx].qty <= 0) cart.splice(idx, 1);
        updateCartUI();
    }

    function openCartModal() { document.getElementById('cartModal').style.display = 'flex'; }
    function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }

    function showOffersModal() {
        document.getElementById('infoTitle').innerText = "🔥 عروض MIM89 اليومية";
        document.getElementById('infoText').innerText = "تابع أقوى عروض الوجبات السريعة والشاورما اليومية المحدثة حصرياً لك!";
        document.getElementById('infoModal').style.display = 'flex';
    }

    function showLocationModal() {
        document.getElementById('infoTitle').innerText = "📍 موقع المطعم";
        document.getElementById('infoText').innerText = "مطعم MIM89 FAST FOOD - متواجدون لخدمتكم وتقديم أسرع خدمة توصيل.";
        document.getElementById('infoModal').style.display = 'flex';
    }

    function showMoreModal() {
        document.getElementById('infoTitle').innerText = "ℹ️ المزيد والتواصل";
        document.getElementById('infoText').innerText = "مطعم MIM89 للفاست فود. نسعى دائماً لتقديم أشهى الوجبات. للتواصل المباشر والطلب يرجى إتمام الطلب عبر سلة الطلبات وسيعمل الكاشير على خدمتك فوراً.";
        document.getElementById('infoModal').style.display = 'flex';
    }

    function closeInfoModal() { document.getElementById('infoModal').style.display = 'none'; }

    function sendOrderToWhatsApp() {
        if (cart.length === 0) return alert("السلة فارغة!");
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        const address = document.getElementById('custAddress').value.trim();
        if (!name || !phone || !address) return alert("يرجى إكمال اسم الزبون، الهاتف، والعنوان!");

        let text = `🔥 *طلب جديد من تطبيق MIM89* 🔥\n\n👤 الزبون: ${name}\n📞 الهاتف: ${phone}\n📍 العنوان: ${address}\n\n🛒 *الطلبات:*`;
        let total = 0;
        cart.forEach(i => {
            text += `\n- ${i.name} (×${i.qty}) : ${(i.price * i.qty).toLocaleString()} د.ع`;
            total += i.price * i.qty;
        });
        text += `\n\n💰 *الإجمالي الكلي:* ${total.toLocaleString()} د.ع`;

        localStorage.setItem('mim89_online_order', JSON.stringify({ customerName: name, phone, address, notes: document.getElementById('custNotes').value, items: cart, type: 'توصيل' }));
        window.open(`https://wa.me/9647800000000?text=${encodeURIComponent(text)}`, '_blank');
        cart = []; updateCartUI(); closeCartModal();
    }

    window.onload = () => {
        loadMenuData();
        renderCategories();
        renderMenu(menuItems);
    };
</script>
</body>
</html>
