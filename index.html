<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM89 FAST FOOD - المينيو الإلكتروني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #111; color: #fff; padding-bottom: 80px; }
        a { text-decoration: none; color: inherit; }
        
        /* الهيدر والشعار */
        header { text-align: center; padding: 25px 0; background: linear-gradient(180deg, #0d0d0d 0%, #1a1a1a 100%); border-bottom: 2px solid #ff9f00; margin-bottom: 20px; }
        .logo h1 { font-size: 38px; color: #ff9f00; font-weight: 900; letter-spacing: 2px; }
        .logo span { font-size: 13px; color: #aaa; letter-spacing: 4px; font-weight: bold; }
        
        /* التنبيه البنري (اختياري) */
        .promo-banner { background-color: #e63946; color: #fff; text-align: center; padding: 8px; font-weight: bold; font-size: 14px; margin-bottom: 15px; }

        /* الأقسام والمينيو */
        .container { max-width: 800px; margin: 0 auto; padding: 0 15px; }
        .category-title { color: #ff9f00; font-size: 22px; font-weight: 700; border-right: 4px solid #ff9f00; padding-right: 10px; margin: 25px 0 15px; text-align: right; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        
        /* كارت الوجبة */
        .menu-item { background-color: #1a1a1a; border-radius: 15px; overflow: hidden; border: 1px solid #333; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
        .menu-item:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255,159,0,0.15); }
        .item-img { width: 100%; height: 180px; object-fit: contain; background-color: #222; border-bottom: 1px solid #333; }
        .item-details { padding: 15px; text-align: right; }
        .item-name { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 5px; }
        .item-desc { font-size: 13px; color: #bbb; line-height: 1.6; margin-bottom: 10px; height: 40px; overflow: hidden; }
        .item-price { font-size: 18px; font-weight: 900; color: #ff9f00; }
        
        /* أزرار وضع الأدمن - مخفية تلقائياً */
        .admin-controls { display: none; position: absolute; top: 10px; left: 10px; gap: 5px; z-index: 10; }
        .admin-btn { background: rgba(0,0,0,0.7); border: 1px solid #ff9f00; color: #ff9f00; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .edit-input { background: #fff; color: #000; border: 1px solid #ff9f00; padding: 3px; font-size: 14px; width: 100%; margin-bottom: 5px; display: none; }
        .file-input { display: none; }

        /* زر حفظ التعديلات للأدمن - مخفي تلقائياً */
        #save-changes-btn { display: none; position: fixed; bottom: 20px; left: 20px; background-color: #ff9f00; color: #000; border: none; padding: 12px 25px; border-radius: 50px; font-weight: 900; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,159,0,0.4); z-index: 1000; }
        #add-item-btn { display: none; background-color: #222; border: 2px solid #ff9f00; color: #ff9f00; padding: 10px 20px; border-radius: 10px; font-weight: bold; margin: 20px auto; cursor: pointer; text-align: center; max-width: 200px; }

        /* تذييل الصفحة */
        footer { text-align: center; padding: 20px; font-size: 12px; color: #666; border-top: 1px solid #333; margin-top: 40px; }
        /* زر الأدمن الخفي */
        #admin-trigger { color: #222; font-size: 10px; cursor: pointer; user-select: none; }

    </style>
</head>
<body>

<header>
    <div class="logo">
        <h1>MIM89</h1>
        <span>FAST FOOD</span>
    </div>
</header>

<div class="promo-banner">
    🎁 عرض اليوم الأول: لفة شاورما مجاناً + خصم 50% على المينيو! 🔥
</div>

<div class="container">
    <div id="menu-container">
        <!-- سيتم توليد المينيو برمجياً هنا -->
    </div>
    
    <!-- أزرار تحكم للأدمن - مخفية -->
    <button id="add-item-btn" onclick="addNewItem()">➕ إضافة وجبة جديدة</button>
</div>

<!-- زر حفظ التعديلات للأدمن - مخفي -->
<button id="save-changes-btn" onclick="saveAdminChanges()">💾 حفظ كافة التعديلات</button>

<footer>
    <p>© 2026 MIM89 FAST FOOD. كافة الحقوق محفوظة.</p>
    <!-- زر خفي للدخول للأدمن -->
    <span id="admin-trigger" onclick="promptAdminLogin()">MIM</span>
</footer>

<script>
    // كلمة المرور الافتراضية (غيّرها لشيء قوي!)
    const ADMIN_PASSWORD = "MIM123"; 
    
    // المينيو الافتراضي الأولي
    let defaultMenu = [
        { id: 1, category: "شاورما صاج", name: "لفة شاورما دجاج (كبير)", desc: "ثومية، مخلل، خبز صاج، بطاطا", price: "5000 د.ع", img: "Images/shawarma.jpg" },
        { id: 2, category: "شاورما صاج", name: "لفة شاورما لحم (دبل)", desc: "عمبة، طماطة، بصل، خبز صاج، بطاطا", price: "7000 د.ع", img: "Images/shawarma_beef.jpg" },
        { id: 3, category: "بركر MIM89", name: "بركر لحم دبل شيدر", desc: "قطعتين لحم 89 خاص، جبنة شيدر، صوص MIM", price: "8000 د.ع", img: "Images/burger_cheddar.jpg" },
        { id: 4, category: "الريزو", name: "طبق ريزو MIM89 خاص", desc: "تمن ريزو، دجاج ستربس، صوص حار/بارد", price: "6000 د.ع", img: "Images/rizo.jpg" }
    ];

    // وضع الأدمن الحالي
    let isAdminMode = false;
    // تحميل المينيو المحفوظ محلياً أو استخدام الافتراضي
    let menuData = JSON.parse(localStorage.getItem('mim89_menu_data')) || defaultMenu;

    // دالة لتوليد المينيو وعرضه في الصفحة
    function renderMenu() {
        const container = document.getElementById('menu-container');
        container.innerHTML = '';
        
        // تجميع الوجبات حسب الأقسام
        const categories = [...new Set(menuData.map(item => item.category))];
        
        categories.forEach(category => {
            const catTitle = document.createElement('div');
            catTitle.className = 'category-title';
            catTitle.innerText = category;
            container.appendChild(catTitle);
            
            const grid = document.createElement('div');
            grid.className = 'menu-grid';
            
            const itemsInCategory = menuData.filter(item => item.category === category);
            
            itemsInCategory.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = 'menu-item';
                itemEl.id = `item-${item.id}`;
                itemEl.innerHTML = `
                    <div class="admin-controls" style="${isAdminMode ? 'display: flex;' : ''}">
                        <button class="admin-btn delete-btn" onclick="deleteItem(${item.id})">🗑️</button>
                        <button class="admin-btn edit-img-btn" onclick="triggerFile('${item.id}')">📷</button>
                    </div>
                    <input type="file" id="file-${item.id}" class="file-input" accept="image/*" onchange="handleFile(this, ${item.id})">
                    <img src="${item.img}" alt="${item.name}" class="item-img">
                    <div class="item-details">
                        <!-- وضع التصفح للزبون -->
                        <h3 class="item-name view-mode">${item.name}</h3>
                        <p class="item-desc view-mode">${item.desc}</p>
                        <p class="item-price view-mode">${item.price}</p>
                        
                        <!-- وضع التعديل للأدمن - مخفي -->
                        <input type="text" value="${item.name}" class="edit-mode edit-input name-input" placeholder="اسم الوجبة">
                        <textarea class="edit-mode edit-input desc-input" placeholder="الوصف">${item.desc}</textarea>
                        <input type="text" value="${item.price}" class="edit-mode edit-input price-input" placeholder="السعر (مثلاً 5000 د.ع)">
                    </div>
                `;
                grid.appendChild(itemEl);
            });
            container.appendChild(grid);
        });
        
        toggleAdminElements();
    }

    // دالة لتفعيل/تعطيل عناصر الأدمن في وضع التعديل
    function toggleAdminElements() {
        document.getElementById('save-changes-btn').style.display = isAdminMode ? 'block' : 'none';
        document.getElementById('add-item-btn').style.display = isAdminMode ? 'block' : 'none';
        
        const controls = document.querySelectorAll('.admin-controls');
        const views = document.querySelectorAll('.view-mode');
        const edits = document.querySelectorAll('.edit-mode');
        
        controls.forEach(el => el.style.display = isAdminMode ? 'flex' : 'none');
        views.forEach(el => el.style.display = isAdminMode ? 'none' : 'block');
        edits.forEach(el => el.style.display = isAdminMode ? 'block' : 'none');
    }

    // دالة تسجيل دخول الأدمن
    function promptAdminLogin() {
        const pass = prompt("أدخل كلمة مرور الأدمن:");
        if (pass === ADMIN_PASSWORD) {
            isAdminMode = true;
            renderMenu();
            alert("تم الدخول لوضع الأدمن بنجاح! يمكنك الآن تعديل الوجبات مباشرة.");
        } else {
            alert("كلمة مرور خاطئة.");
        }
    }

    // دالة لحفظ التعديلات التي قام بها الأدمن محلياً
    function saveAdminChanges() {
        menuData = menuData.map(item => {
            const itemEl = document.getElementById(`item-${item.id}`);
            if (itemEl) {
                return {
                    ...item,
                    name: itemEl.querySelector('.name-input').value,
                    desc: itemEl.querySelector('.desc-input').value,
                    price: itemEl.querySelector('.price-input').value
                    // تم حفظ مسار الصورة عند الرفع
                };
            }
            return item;
        });
        
        // حفظ البيانات محلياً في المتصفح
        localStorage.setItem('mim89_menu_data', JSON.stringify(menuData));
        isAdminMode = false;
        renderMenu();
        alert("تم حفظ كافة التعديلات بنجاح وستظهر للزبائن!");
    }

    // دالة لإضافة وجبة جديدة
    function addNewItem() {
        const id = Date.now();
        menuData.push({ id: id, category: "قسم جديد (عدله)", name: "اسم وجبة جديدة", desc: "وصف الوجبة...", price: "السعر د.ع", img: "Images/default_food.jpg" });
        renderMenu();
        // تمرير لآخر عنصر
        document.getElementById(`item-${id}`).scrollIntoView({ behavior: 'smooth' });
    }

    // دالة لحذف وجبة
    function deleteItem(id) {
        if (confirm("هل أنت متأكد من حذف هذه الوجبة نهائياً؟")) {
            menuData = menuData.filter(item => item.id !== id);
            renderMenu();
        }
    }

    // دوال التعامل مع رفع الملفات/الصور
    function triggerFile(id) {
        document.getElementById(`file-${id}`).click();
    }
    
    function handleFile(input, id) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // تحديث مسار الصورة في كارت الوجبة مؤقتاً
                document.getElementById(`item-${id}`).querySelector('.item-img').src = e.target.result;
                
                // تحديث مسار الصورة في قاعدة البيانات (Base64)
                menuData = menuData.map(item => {
                    if (item.id === id) {
                        return { ...item, img: e.target.result };
                    }
                    return item;
                });
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // البدء بتوليد المينيو عند فتح الصفحة
    renderMenu();

</script>

</body>
</html>
