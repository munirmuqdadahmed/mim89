<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIM89 FAST FOOD - المينيو الإلكتروني الفاخر</title>
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0a0a0e;
            --bg-card: #14141c;
            --bg-glass: rgba(20, 20, 28, 0.85);
            --gold-primary: #f59e0b;
            --gold-bright: #fbbf24;
            --gold-glow: rgba(245, 158, 11, 0.3);
            --text-light: #ffffff;
            --text-muted: #a1a1aa;
            --border-color: rgba(245, 158, 11, 0.2);
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-light); padding-bottom: 110px; direction: rtl; overflow-x: hidden; }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-primary); }

        /* Header Header Area */
        .modern-header {
            position: relative;
            background: linear-gradient(180deg, #181824 0%, #0a0a0e 100%);
            padding: 30px 20px 20px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            overflow: hidden;
        }

        .header-bg-glow {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .brand-title { 
            font-size: 2.4rem; 
            font-weight: 900; 
            background: linear-gradient(135deg, #ffffff 0%, var(--gold-bright) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            position: relative;
            z-index: 1;
            margin-bottom: 2px;
        }

        .brand-subtitle { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 4px; display: block; font-weight: 700; }
        .brand-tagline { font-size: 0.95rem; color: var(--gold-primary); margin-top: 8px; font-weight: 700; position: relative; z-index: 1; }

        /* Search Bar */
        .search-container { padding: 15px 20px; max-width: 600px; margin: 0 auto; }
        .search-box {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        .search-box:focus-within {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px var(--gold-glow);
        }
        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .search-box i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-primary);
            font-size: 1.1rem;
        }

        /* Categories Bar */
        .categories-wrapper {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 20px;
            scroll-behavior: smooth;
            scrollbar-width: none;
            position: sticky;
            top: 0;
            background: rgba(10, 10, 14, 0.95);
            backdrop-filter: blur(12px);
            z-index: 900;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .categories-wrapper::-webkit-scrollbar { display: none; }
        .category-tab {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-muted);
            padding: 9px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .category-tab.active, .category-tab:hover {
            background: linear-gradient(135deg, var(--gold-primary) 0%, #d97706 100%);
            color: #000;
            border-color: var(--gold-bright);
            box-shadow: 0 4px 15px var(--gold-glow);
            transform: translateY(-1px);
        }

        /* Menu Container & Grid */
        .container { max-width: 1200px; margin: 0 auto; padding: 10px 20px; }
        .section-title { 
            font-size: 1.3rem; 
            font-weight: 800;
            color: var(--gold-bright); 
            margin: 25px 0 15px 0; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            border-right: 4px solid var(--gold-primary); 
            padding-right: 12px; 
        }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 15px;
        }

        @media (min-width: 640px) {
            .items-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 20px;
            }
        }

        /* Product Card */
        .item-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
            position: relative;
        }
        .item-card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 12px 30px rgba(0,0,0,0.6), 0 0 20px var(--gold-glow);
            border-color: var(--border-color);
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
        }

        @media (min-width: 640px) {
            .img-wrapper { height: 170px; }
        }

        .item-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            cursor: pointer; 
            transition: transform 0.5s ease;
        }
        .item-card:hover .item-img { transform: scale(1.08); }

        .item-details { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .item-name { font-size: 0.95rem; font-weight: 800; color: #fff; margin-bottom: 4px; cursor: pointer; line-height: 1.3; }
        .item-desc { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 12px; flex-grow: 1; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .item-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.08); }
        .item-price { font-size: 1rem; font-weight: 900; color: var(--gold-bright); }
        
        .add-cart-btn {
            background: linear-gradient(135deg, var(--gold-primary) 0%, #d97706 100%);
            color: #000;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 3px 10px var(--gold-glow);
        }
        .add-cart-btn:hover { transform: scale(1.1); }
        .add-cart-btn:active { transform: scale(0.9); }

        /* Floating Bottom Cart Bar */
        .floating-cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-color);
            padding: 12px 20px;
            z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-info-group { display: flex; align-items: center; gap: 12px; }
        .cart-icon-wrapper {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-bright);
            font-size: 1.2rem;
        }

        .cart-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--danger);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 900;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-main);
        }

        .cart-totals { display: flex; flex-direction: column; }
        .cart-totals-label { font-size: 0.75rem; color: var(--text-muted); }
        .cart-totals-amount { font-size: 1.1rem; font-weight: 900; color: var(--gold-bright); }

        .checkout-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            padding: 11px 22px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .checkout-btn:active { transform: scale(0.96); }

        /* Modal Base */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 15px;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            position: relative;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalPop {
            0% { transform: scale(0.88); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .close-modal-btn {
            position: absolute;
            top: 16px; left: 18px;
            background: rgba(255,255,255,0.05);
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .close-modal-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }

        .modal-title { color: var(--gold-bright); font-size: 1.25rem; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        
        .form-control {
            width: 100%;
            padding: 13px 15px;
            background: #0a0a0e;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--gold-primary); }

        .gold-btn {
            background: linear-gradient(135deg, var(--gold-primary) 0%, #d97706 100%);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 18px var(--gold-glow);
            transition: all 0.2s;
        }
        .gold-btn:active { transform: scale(0.98); opacity: 0.9; }

        /* Public Menu Specific Banner */
        .menu-hero-banner {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(0,0,0,0) 100%);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 15px;
            margin: 15px auto 5px auto;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .hero-banner-text h3 { color: var(--gold-bright); font-size: 1rem; font-weight: 800; margin-bottom: 2px; }
        .hero-banner-text p { color: var(--text-muted); font-size: 0.8rem; }
    </style>

    <!-- Firebase SDKs Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="public-menu-body">

    <!-- Header Section -->
    <header class="modern-header">
        <div class="header-bg-glow"></div>
        <div class="brand-badge">
            <span class="status-dot"></span>
            مفتوح الآن - استقبال الطلبات اللحظي
        </div>
        <h1 class="brand-title">MIM89</h1>
        <span class="brand-subtitle">FAST FOOD</span>
        <p class="brand-tagline">الطعم اللي ما يتكرر 🔥</p>
    </header>

    <!-- Search Section -->
    <div class="search-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="publicSearchInput" placeholder="ابحث عن وجبتك المفضلة (شاورما، بركر...)" oninput="filterPublicMenu()">
        </div>
    </div>

    <!-- Banner Notice -->
    <div class="container">
        <div class="menu-hero-banner">
            <div class="hero-banner-text">
                <h3>🌯 شاورما دجاج طازجة يومياً</h3>
                <p>تجهيز إكسبريس مباشر وحار يصلك أينما تكون</p>
            </div>
            <i class="fa-solid fa-fire-flame-curved" style="color: var(--gold-primary); font-size: 1.8rem;"></i>
        </div>
    </div>

    <!-- Categories Navigation Bar -->
    <div class="categories-wrapper" id="categoriesNav"></div>

    <!-- Dynamic Menu Sections -->
    <main id="menuSections" class="container"></main>

    <!-- Floating Bottom Cart Action Bar -->
    <div class="floating-cart-bar">
        <div class="cart-info-group" onclick="openCartModal()" style="cursor: pointer;">
            <div class="cart-icon-wrapper">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cartBadgeCount" class="cart-badge">0</span>
            </div>
            <div class="cart-totals">
                <span class="cart-totals-label">مجموع السلة</span>
                <span id="floatingCartTotal" class="cart-totals-amount">0 د.ع</span>
            </div>
        </div>
        <button class="checkout-btn" onclick="openCartModal()">
            إتمام الطلب
            <i class="fa-solid fa-arrow-left"></i>
        </button>
    </div>

    <!-- Modal: Item Details -->
    <div id="itemDetailModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeModal('itemDetailModal')">&times;</button>
            <img id="detailImg" src="" style="width:100%; height:200px; object-fit:cover; border-radius:16px; margin-bottom:14px; border:1px solid rgba(255,255,255,0.08);">
            <h2 id="detailTitle" class="modal-title"></h2>
            <p id="detailPrice" style="color:var(--gold-bright); font-weight:900; font-size:1.2rem; margin-bottom:10px;"></p>
            <p id="detailIngredients" style="color:var(--text-muted); font-size:0.88rem; margin-bottom:22px; line-height:1.6; background:#0a0a0e; padding:10px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.05);"></p>
            <button id="detailAddBtn" class="gold-btn"><i class="fa-solid fa-cart-plus"></i> إضافة للسلة الآن</button>
        </div>
    </div>

    <!-- Modal: Cart & Checkout -->
    <div id="cartModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeModal('cartModal')">&times;</button>
            <h3 class="modal-title"><i class="fa-solid fa-utensils"></i> سلة وجباتك</h3>
            
            <div id="cartItemsContainer" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>

            <div style="margin-bottom: 12px;">
                <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 6px; font-weight: bold;">نوع الخدمة المطلوبة:</label>
                <select id="orderTypeSelect" onchange="toggleDeliveryFields()" class="form-control">
                    <option value="delivery">🚗 توصيل للبيت (سريع)</option>
                    <option value="takeaway">🛍️ سفري من المطعم</option>
                    <option value="dine_in">🍽️ تناول داخل الصالة</option>
                </select>
            </div>

            <div id="deliveryFieldsGroup">
                <input type="text" id="custName" placeholder="الاسم الكريم *" class="form-control">
                <input type="tel" id="custPhone" placeholder="رقم الهاتف العراقي (07...) *" class="form-control">
                <input type="text" id="custArea" placeholder="المنطقة (مثلاً: القاهرة) *" oninput="calculateDeliveryCost()" class="form-control">
                <input type="text" id="custAddress" placeholder="العنوان التفصيلي / أقرب نقطة دالة *" oninput="calculateDeliveryCost()" class="form-control">
            </div>

            <textarea id="orderNotes" placeholder="أي ملاحظات مخصصة (بدون ثوم، سبايسي...)؟" class="form-control" style="height: 55px; resize: none;"></textarea>

            <div style="background: #0a0a0e; padding: 14px; border-radius: 14px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.08); font-size: 0.9rem;">
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; color:var(--text-muted);">
                    <span>مجموع الوجبات:</span>
                    <span id="subtotalPrice">0 د.ع</span>
                </div>
                <div id="deliveryFeeLine" style="display:flex; justify-content:space-between; margin-bottom:6px; color:var(--gold-bright);">
                    <span>أجور التوصيل:</span>
                    <span id="deliveryFeePrice">0 د.ع</span>
                </div>
                <div style="display:flex; justify-content:space-between; font-weight:900; font-size:1.1rem; color:var(--gold-primary); border-top:1px dashed rgba(255,255,255,0.1); padding-top:8px; margin-top:6px;">
                    <span>المجموع النهائي:</span>
                    <span id="finalTotalPrice">0 د.ع</span>
                </div>
            </div>

            <button onclick="submitOrderToCashier()" class="gold-btn" style="background: linear-gradient(135deg, #25d366 0%, #128c7e 100%); color: #fff; box-shadow: 0 4px 18px rgba(37, 211, 102, 0.3);">
                <i class="fa-brands fa-whatsapp"></i> تأكيد وإرسال الفاتورة عبر الواتساب
            </button>
        </div>
    </div>

    <!-- Realtime Cloud Listener Script Sync -->
    <script>
        function updateFloatingCartTotal() {
            const totalEl = document.getElementById('finalTotalPrice');
            const floatingTotal = document.getElementById('floatingCartTotal');
            if (totalEl && floatingTotal) {
                floatingTotal.innerText = totalEl.innerText !== '0 د.ع' ? totalEl.innerText : (document.getElementById('subtotalPrice') ? document.getElementById('subtotalPrice').innerText : '0 د.ع');
            }
        }

        // مراقبة السحابة والبحث المباشر
        function filterPublicMenu() {
            const query = document.getElementById('publicSearchInput').value.toLowerCase().trim();
            const sections = document.querySelectorAll('.menu-section');
            sections.forEach(sec => {
                const cards = sec.querySelectorAll('.item-card');
                let hasVisible = false;
                cards.forEach(card => {
                    const name = card.querySelector('.item-name').innerText.toLowerCase();
                    const desc = card.querySelector('.item-desc').innerText.toLowerCase();
                    if (name.includes(query) || desc.includes(query)) {
                        card.style.display = 'flex';
                        hasVisible = true;
                    } else {
                        card.style.display = 'none';
                    }
                });
                sec.style.display = hasVisible ? 'block' : 'none';
            });
        }

        // المزامنة اللحظية مع التعديلات
        window.addEventListener('storage', (e) => {
            if (e.key === 'sys_items' || e.key === 'sys_categories') {
                if (typeof loadPublicMenu === 'function') loadPublicMenu();
            }
        });
    </script>

    <!-- Master Engine -->
    <script src="app.js"></script>
</body>
</html>
