<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM89 FAST FOOD - قائمة الطعام</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding-bottom: 70px; /* مساحة لشريط التنقل السفلي */
        }

        /* الهيدر الأنيق */
        header {
            background-color: #1a1a1a;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            background-color: #ff9800;
            color: #000;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 4px 12px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 5px;
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 3px;
        }

        /* البحث والتصنيفات */
        .search-container {
            padding: 15px 20px 5px;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #333;
            background-color: #222;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .categories-tab {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .category-btn {
            background-color: #262626;
            color: #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .category-btn.active {
            background-color: #ff9800;
            color: #000;
            font-weight: bold;
        }

        /* عناوين الأقسام */
        .section-title {
            font-size: 1.3rem;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-weight: bold;
        }

        /* شبكة الوجبات المنظمة */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 10px 20px;
        }

        /* كارت الوجبة */
        .food-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #2a2a2a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        .food-card:hover {
            transform: translateY(-3px);
        }

        .food-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
        }

        .food-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .food-name {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #fff;
        }

        .food-desc {
            font-size: 0.75rem;
            color: #999;
            margin-bottom: 10px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .food-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .food-price {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
        }

        .add-btn {
            background-color: #ffffff;
            color: #000;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* شريط التنقل السفلي الأصلي (Bottom Nav) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #888;
            text-decoration: none;
            font-size: 0.75rem;
            cursor: pointer;
            position: relative;
        }

        .nav-item.active {
            color: #ff9800;
        }

        .nav-icon {
            font-size: 1.3rem;
            margin-bottom: 2px;
        }

        .cart-badge-nav {
            position: absolute;
            top: -4px;
            right: 18px;
            background-color: #ff9800;
            color: #000;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- الهيدر الأصلي -->
    <header>
        <div class="brand-logo">MIM89</div>
        <div class="brand-title">FAST FOOD</div>
        <div class="brand-subtitle">أشهى وجبات الدجاج السريعة بأعلى جودة</div>
    </header>

    <!-- البحث -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن وجبتك المفضلة..." oninput="filterMenu()">
    </div>

    <!-- التصنيفات -->
    <div class="categories-tab">
        <button class="category-btn active" onclick="filterCategory('all', this)">الكل</button>
        <button class="category-btn" onclick="filterCategory('shawarma', this)">وجبات الشاورما الدجاج</button>
        <button class="category-btn" onclick="filterCategory('burger', this)">قسم البركر</button>
        <button class="category-btn" onclick="filterCategory('fried_chicken', this)">قسم الكنتاكي</button>
        <button class="category-btn" onclick="filterCategory('rizo', this)">قسم الريزو</button>
        <button class="category-btn" onclick="filterCategory('appetizers', this)">المقبلات والمقرمشات</button>
        <button class="category-btn" onclick="filterCategory('drinks', this)">المشروبات والإضافات</button>
    </div>

    <!-- حاوي الوجبات -->
    <div id="menuContainer"></div>

    <!-- شريط التنقل السفلي الأصلي -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            <span class="nav-icon">🏠</span>
            <span>الرئيسية</span>
        </div>
        <div class="nav-item" onclick="openCart()">
            <span class="nav-icon">🛒</span>
            <span>السلة</span>
            <span id="cartCountNav" class="cart-badge-nav" style="display:none;">0</span>
        </div>
        <div class="nav-item" onclick="alert('MIM89 FAST FOOD - أهلاً وسهلاً بكم!')">
            <span class="nav-icon">➕</span>
            <span>المزيد</span>
        </div>
    </div>

    <script>
        // كافة الوجبات والأقسام المعتمدة
        const menuItems = [
            // قسم الشاورما
            { id: 101, name: "شاورما صاج عادي", category: "shawarma", price: 3000, desc: "خبز صاج، شاورما دجاج طازجة، صلصة ثومية، مخلل", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=500&q=80" },
            { id: 102, name: "شاورما صاج دبل", category: "shawarma", price: 5000, desc: "خبز صاج مضاعف، دجاج إضافي، ثومية، مخلل، بطاطس", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=500&q=80" },
            { id: 103, name: "شاورما صاج سوبر", category: "shawarma", price: 6000, desc: "وجبة شاورما غنية بالجبن والمكونات الخاصة", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=500&q=80" },
            { id: 104, name: "شاورما عربي (وجبة)", category: "shawarma", price: 7000, desc: "تقطيع عربي مع بطاطس مقلية، ثومية ومخلل", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=500&q=80" },
            { id: 105, name: "وجبة شاورما دبل", category: "shawarma", price: 9000, desc: "ساندويتشين عربي + بطاطس عائلية + صوصات", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=500&q=80" },
            { id: 106, name: "شاورما فرت (250 غم)", category: "shawarma", price: 7500, desc: "لحم دجاج شاورما صافي 250 غرام", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=500&q=80" },
            { id: 107, name: "شاورما فرت (500 غم)", category: "shawarma", price: 14000, desc: "لحم دجاج شاورما صافي نصف كيلو", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=500&q=80" },
            { id: 108, name: "شاورما 89 الخاص", category: "shawarma", price: 8500, desc: "تتبيلة 89 المميزة، جبنة موزاريلا، بطاطس وصوص خاص", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?auto=format&fit=crop&w=500&q=80" },

            // قسم البركر
            { id: 201, name: "بركر كلاسيك (لحم)", category: "burger", price: 6000, desc: "قطعة لحم مشوية، خس، طماطم، بصل، مخلل، صوص خاص", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80" },
            { id: 202, name: "بركر الجبن (لحم)", category: "burger", price: 6500, desc: "قطعة لحم مشوية، جبنة شيدر، خس، طماطم، صوص", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80" },
            { id: 203, name: "دبل تشيز بركر (لحم)", category: "burger", price: 8500, desc: "شريحتا لحم مشويتان، double شيدر، صوص خاص", img: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=500&q=80" },
            { id: 204, name: "بركر 89 الخاص (لحم)", category: "burger", price: 9500, desc: "شريحة لحم مشوية، صوص 89، جبن، بصل وموزاريلا مقرمشة", img: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=500&q=80" },
            { id: 205, name: "تشيكن فيليه (دجاج)", category: "burger", price: 5500, desc: "قطعة دجاج مقرمشة، خس، جبنة شيدر، صوص خاص", img: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?auto=format&fit=crop&w=500&q=80" },
            { id: 206, name: "بركر 89 الخاص (دجاج)", category: "burger", price: 8500, desc: "3 قطع ستربس دجاج، صوص 89، جبن، موزاريلا مقرمشة", img: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?auto=format&fit=crop&w=500&q=80" },

            // قسم الكنتاكي
            { id: 301, name: "وجبة كنتاكي (قطعتين)", category: "fried_chicken", price: 6500, desc: "2 قطعة دجاج مقرمش + بطاطس + صوص + خبز", img: "https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?auto=format&fit=crop&w=500&q=80" },
            { id: 302, name: "وجبة كنتاكي (4 قطع)", category: "fried_chicken", price: 11500, desc: "4 قطع دجاج مقرمش + بطاطس + كول سلو + صوص", img: "https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?auto=format&fit=crop&w=500&q=80" },
            { id: 303, name: "وجبة كنتاكي (6 قطع)", category: "fried_chicken", price: 16000, desc: "6 قطع دجاج مقرمش + بطاطس حجم عائلي + صوصات", img: "https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?auto=format&fit=crop&w=500&q=80" },
            { id: 304, name: "🔥 بوكس العائلة (Family Box)", category: "fried_chicken", price: 28000, desc: "12 قطعة دجاج مقرمش + بطاطس عائلي + كول سلو + لتر بيبسي", img: "https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?auto=format&fit=crop&w=500&q=80" },

            // قسم الريزو
            { id: 401, name: "ريزو كلاسيك", category: "rizo", price: 5000, desc: "أرز مبهر مع قطع دجاج مقرمشة وصوص خاص", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80" },
            { id: 402, name: "ريزو 89 الخاص", category: "rizo", price: 6500, desc: "أرز بنكهة خاصة، قطع دجاج، صوص 89، وجبنة شيدر مذابة", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80" },

            // قسم المقبلات والمقرمشات
            { id: 501, name: "فنكر كلاسيك", category: "appetizers", price: 2500, desc: "قطع دجاج مقرمشة تقدم مع الصوص الخاص", img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=500&q=80" },
            { id: 502, name: "فنكر 89 الخاص", category: "appetizers", price: 4000, desc: "قطع دجاج مقرمشة تقدم مع صوص 89 الخاص", img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=500&q=80" },
            { id: 503, name: "أصابع موزاريلا", category: "appetizers", price: 4000, desc: "جبنة موزاريلا مقرمشة غنية", img: "https://images.unsplash.com/photo-1531749668029-2db88e4276c7?auto=format&fit=crop&w=500&q=80" },
            { id: 504, name: "حلقات بصل", category: "appetizers", price: 3000, desc: "حلقات بصل مقرمشة ومتبلة", img: "https://images.unsplash.com/photo-1639024471283-03518883512d?auto=format&fit=crop&w=500&q=80" },

            // المشروبات والإضافات
            { id: 601, name: "مشروب غازي (بيبسي / سفن / ميرندا)", category: "drinks", price: 1000, desc: "علبة باردة 330 مل", img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=500&q=80" },
            { id: 602, name: "ماء معدني", category: "drinks", price: 500, desc: "عبوة ماء باردة", img: "https://images.unsplash.com/photo-1548839140-29a749e1bc4e?auto=format&fit=crop&w=500&q=80" },
            { id: 603, name: "إضافة (جبنة / صوص / هالابينو)", category: "drinks", price: 1000, desc: "إضافة اختيارية للوجبات", img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=500&q=80" }
        ];

        let cart = [];
        let currentCategory = 'all';

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            const categories = {
                'shawarma': '🍴 وجبات الشاورما الدجاج',
                'burger': '🍔 قسم البركر',
                'fried_chicken': '🍗 قسم الكنتاكي',
                'rizo': '🍚 قسم الريزو',
                'appetizers': '🍟 المقبلات والمقرمشات',
                'drinks': '🥤 المشروبات والإضافات'
            };

            for (let catKey in categories) {
                if (currentCategory !== 'all' && currentCategory !== catKey) continue;

                const filteredItems = menuItems.filter(item => 
                    item.category === catKey && 
                    (item.name.toLowerCase().includes(searchKeyword) || item.desc.toLowerCase().includes(searchKeyword))
                );

                if (filteredItems.length > 0) {
                    let sectionHTML = `
                        <div class="section-title">${categories[catKey]}</div>
                        <div class="items-grid">
                    `;

                    filteredItems.forEach(item => {
                        sectionHTML += `
                            <div class="food-card">
                                <img src="${item.img}" alt="${item.name}">
                                <div class="food-info">
                                    <div class="food-name">${item.name}</div>
                                    <div class="food-desc">${item.desc}</div>
                                    <div class="food-bottom">
                                        <span class="food-price">${item.price.toLocaleString()} د.ع</span>
                                        <button class="add-btn" onclick="addToCart(${item.id})">+</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    sectionHTML += `</div>`;
                    container.innerHTML += sectionHTML;
                }
            }
        }

        function addToCart(itemId) {
            const item = menuItems.find(i => i.id === itemId);
            const exist = cart.find(c => c.id === itemId);

            if (exist) {
                exist.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCartNav();
        }

        function updateCartNav() {
            const badge = document.getElementById('cartCountNav');
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            if (count > 0) {
                badge.innerText = count;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
        }

        function openCart() {
            if(cart.length === 0) {
                alert("السلة فارغة حالياً!");
            } else {
                alert(`لديك ${cart.reduce((s,i)=>s+i.qty,0)} وجبات في السلة!`);
            }
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMenu();
        }

        function filterMenu() {
            renderMenu();
        }

        // التشغيل الابتدائي
        renderMenu();
    </script>
</body>
</html>
