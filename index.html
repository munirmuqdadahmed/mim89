<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المينيو الإلكتروني</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="public-menu-body">

    <!-- Header / الهيدر الرئيسي -->
    <header class="main-header">
        <div class="header-container">
            <h1 class="brand-title"><i class="fa-solid fa-utensils"></i> قائمـة الطعام</h1>
            <p class="brand-subtitle">أشهى الوجبات الطازجة يومياً</p>
        </div>
    </header>

    <!-- Navigation Categories / أشرطة الأقسام -->
    <nav class="categories-nav">
        <div class="categories-container" id="categoriesNav">
            <!-- يتم تحميل الأقسام ديناميكياً بواسطة JavaScript -->
        </div>
    </nav>

    <!-- Main Content Area / منطقة عرض الأصناف -->
    <main class="menu-container">
        <div id="menuSections">
            <!-- يتم تحميل الأصناف داخل أقسمها ديناميكياً -->
        </div>
    </main>

    <!-- Modal for Item Details / نافذة تفاصيل الصنف والمواد -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                <img id="modalImage" src="" alt="صورة الصنف" class="modal-img">
                <h2 id="modalTitle" class="modal-title"></h2>
                <span id="modalPrice" class="modal-price"></span>
                <hr>
                <h3>المكونات والمواد:</h3>
                <p id="modalIngredients" class="modal-ingredients"></p>
            </div>
        </div>
    </div>

    <!-- JavaScript File -->
    <script src="app.js"></script>
</body>
</html>
