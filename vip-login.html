<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM89 VIP - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif; direction: rtl;
            background: #060608; color: #fff; margin: 0;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .card {
            background: #111116; border: 1px solid #ffd700; border-radius: 16px;
            padding: 28px 22px; max-width: 380px; width: 100%;
        }
        h1 { text-align: center; color: #ffd700; font-size: 1.3rem; margin-bottom: 20px; }
        label { display: block; font-size: 0.78rem; color: #ccc; margin-bottom: 5px; margin-top: 11px; }
        input {
            width: 100%; padding: 10px; background: #0d0d11; border: 1px solid #2a2a35;
            border-radius: 8px; color: #fff; font-size: 0.92rem; font-family: inherit;
        }
        button {
            width: 100%; margin-top: 20px; padding: 13px; background: #ffd700;
            color: #000; border: none; border-radius: 8px; font-weight: 900;
            font-size: 1rem; cursor: pointer; font-family: inherit;
        }
        button:disabled { opacity: 0.6; }
        .error { color: #ef4444; font-size: 0.8rem; margin-top: 10px; text-align: center; }
        .link { text-align: center; margin-top: 14px; font-size: 0.82rem; }
        .link a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌟 دخول MIM89 VIP</h1>

        <label>رقم هاتفك:</label>
        <input type="tel" id="phone" placeholder="07xxxxxxxxx" style="direction:ltr;text-align:left;">
        <label>رمزك الشخصي:</label>
        <input type="password" id="pin" placeholder="••••" inputmode="numeric"
               style="direction:ltr;text-align:center;letter-spacing:3px;">
        <button id="submitBtn" onclick="handleLogin()">دخول</button>
        <div id="errorMsg" class="error"></div>
        <div class="link">ماعندك عضوية؟ <a href="vip-signup.html">انضم الآن مجاناً</a></div>
        <div class="link"><a href="index.html">🔙 رجوع للمينيو</a></div>
    </div>

    <script src="app.js?v=1729"></script>
    <script>
        async function handleLogin() {
            const phone = document.getElementById('phone').value.trim();
            const pin   = document.getElementById('pin').value.trim();
            const errEl = document.getElementById('errorMsg');
            const btn   = document.getElementById('submitBtn');
            errEl.innerText = '';

            if (!phone || !pin) return errEl.innerText = '⚠️ أدخل رقم هاتفك ورمزك.';

            btn.disabled = true;
            btn.innerText = 'جاري الدخول...';

            try {
                await logInLoyaltyMember(phone, pin);
                window.location.href = 'vip-card.html';
            } catch (err) {
                btn.disabled = false;
                btn.innerText = 'دخول';
                errEl.innerText = '⚠️ ' + (err.message || 'صار خطأ، حاول مرة ثانية.');
            }
        }
    </script>
</body>
</html>
