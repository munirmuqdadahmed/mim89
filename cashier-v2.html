<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIM89 POS - الشاشة المباشرة</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold-primary: #f59e0b;
            --gold-bright: #fbbf24;
            --bg-dark: #0c0c0e;
            --card-bg: #141419;
            --card-border: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --success: #10b981;
            --blue-accent: #38bdf8;
            --purple-accent: #a855f7;
        }

        * {
            box-sizing: border-box !important;
            margin: 0; padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-dark);
            color: #f3f4f6;
            overflow: hidden !important;
            height: 100vh; width: 100vw;
        }

        /* ❌ منع أي صورة من الخروج خارج حجم بطاقتها كلياً */
        img {
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: cover !important;
        }

        #cashierMainApp {
            display: flex;
            height: 100vh;
            flex-direction: column;
            overflow: hidden;
        }

        /* 🔝 الهيدر العلوي */
        .pos-header {
            background: #111116;
            border-bottom: 1px solid var(--card-border);
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
            flex-shrink: 0;
            z-index: 100;
        }

        .brand-btn {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--gold-primary);
            color: var(--gold-bright);
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
        }

        /* 🍔 البردة الجانبية */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 90000; display: none;
        }
        .side-drawer {
            position: fixed; top: 0; right: -320px; width: 300px; height: 100%;
            background: #111116; border-left: 1px solid var(--gold-primary); z-index: 90001;
            transition: right 0.3s ease; display: flex; flex-direction: column; padding: 20px;
        }
        .side-drawer.active { right: 0 !important; }
        .drawer-overlay.active { display: block !important; }

        .drawer-link {
            width: 100%; padding: 12px; background: #181820; border: 1px solid var(--card-border);
            border-radius: 10px; color: #fff; font-size: 0.88rem; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; gap: 10px; margin-bottom: 8px; text-align: right;
        }

        /* 📐 التقسيم الشامل لشاشة POSBANK */
        .pos-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: calc(100vh - 50px);
            width: 100%;
            overflow: hidden;
        }

        .pos-sidebar {
            background: #09090c;
            border-left: 1px solid var(--card-border);
            padding: 8px;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .cart-box {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-border);
            padding: 8px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cart-items-scroll {
            flex: 1;
            overflow-y: auto !important;
            margin: 6px 0;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a22;
            padding: 6px 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #282835;
        }

        .pos-main {
            padding: 10px;
            overflow-y: auto !important;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            position: relative;
        }

        .categories-chips {
            display: flex;
            gap: 6px;
            overflow-x: auto !important;
            padding-bottom: 4px;
            scrollbar-width: none;
            flex-shrink: 0;
        }
        .categories-chips::-webkit-scrollbar { display: none; }

        .chip-tab {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: #aaa;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            flex: 0 0 auto;
        }
        .chip-tab.active {
            background: var(--gold-primary);
            color: #000;
            font-weight: 900;
            border-color: var(--gold-bright);
        }

        /* 📦 شبكة المنتجات وتثبيت الارتفاع للحماية */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
            gap: 10px;
            align-content: start;
            flex-grow: 1;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden !important;
            height: 140px !important;
            max-height: 140px !important;
        }
        .product-card:active { transform: scale(0.97); }

        .product-card img {
            width: 100% !important;
            height: 70px !important;
            max-height: 70px !important;
            object-fit: cover !important;
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .gold-btn {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-bright));
            color: #000; border: none; padding: 8px; font-weight: 900; border-radius: 8px;
            cursor: pointer; width: 100%; font-size: 0.85rem; display: inline-flex; justify-content: center; align-items: center; gap: 6px;
        }

        .toggle-btn-group { display: flex; gap: 4px; margin-bottom: 6px; }
        .t-btn {
            flex: 1; padding: 6px; background: #181820; border: 1px solid var(--card-border);
            color: #ccc; border-radius: 6px; font-weight: 800; font-size: 0.78rem;
            cursor: pointer; text-align: center;
        }
        .t-btn.active { background: var(--gold-primary); color: #000; font-weight: 900; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); display: none;
            justify-content: center; align-items: center; z-index: 99999; padding: 15px;
        }

        .modal-body {
            background: var(--card-bg); border: 1px solid var(--gold-primary);
            padding: 18px; border-radius: 16px; width: 100%; max-width: 440px;
        }

        #drawerPrintFrame { display: none; }
    </style>
</head>
<body>

    <!-- 🍔 البردة الجانبية المباشرة -->
    <div id="drawerOverlay" class="drawer-overlay" onclick="toggleSideDrawer()"></div>
    <aside id="sideDrawer" class="side-drawer">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #333; padding-bottom:10px;">
            <h3 style="color:var(--gold-bright); font-size:1.1rem;"><i class="fa-solid fa-sliders"></i> خيارات النظام</h3>
            <button onclick="toggleSideDrawer()" style="background:none; border:none; color:#aaa; font-size:1.3rem;">✕</button>
        </div>
        <button class="drawer-link" onclick="openDriverAccountModal(); toggleSideDrawer();" style="color:var(--blue-accent);">
            <i class="fa-solid fa-motorcycle"></i> كشف وإدارة السائقين 🛵
        </button>
        <button class="drawer-link" onclick="cleanOldStorageAndReload();" style="color:var(--gold-bright);">
            <i class="fa-solid fa-broom"></i> تنظيف الذاكرة وتصحيح الأقسام 🧹
        </button>
        <button class="drawer-link" onclick="location.reload();" style="color:var(--danger); margin-top:auto;">
            <i class="fa-solid fa-rotate-right"></i> إعادة تحميل الواجهة
        </button>
    </aside>

    <!-- 🖥️ التطبيق الرئيسي المباشر -->
    <div id="cashierMainApp">
        <header class="pos-header">
            <button class="brand-btn" onclick="toggleSideDrawer()">
                <i class="fa-solid fa-bars"></i> MIM89 POS
            </button>
            <div style="display:flex; gap:10px; align-items:center;">
                <span style="color:var(--gold-bright); font-size:0.88rem; font-weight:800;">👤 الكاشير: الرئيسي</span>
                <button onclick="openCashDrawerDirect()" class="gold-btn" style="width:auto; padding:6px 14px; font-size:0.82rem; background:#222; color:#fff; border:1px solid var(--gold-primary);">
                    <i class="fa-solid fa-box-open"></i> فتح الدرج
                </button>
            </div>
        </header>

        <div class="pos-container">
            <!-- 🛒 السلة الجانبية -->
            <aside class="pos-sidebar">
                <div class="cart-box">
                    <span style="font-size:0.72rem; color:#888; font-weight:bold;">نوع الخدمة:</span>
                    <div class="toggle-btn-group" id="posOrderTypeGroup">
                        <button type="button" class="t-btn active" data-value="dine_in" onclick="selectOrderType(this)">🍽️ صالة</button>
                        <button type="button" class="t-btn" data-value="takeaway" onclick="selectOrderType(this)">🛍️ سفري</button>
                        <button type="button" class="t-btn" data-value="delivery" onclick="selectOrderType(this)">🛵 توصيل</button>
                    </div>

                    <div id="driverSelectBox" style="display:none; margin-bottom:4px;">
                        <select id="posDriverSelect" class="gold-input-inline" style="font-size:0.8rem; padding:4px;"></select>
                    </div>

                    <span style="font-size:0.72rem; color:#888; font-weight:bold;">طريقة الدفع:</span>
                    <div class="toggle-btn-group" id="posPaymentGroup">
                        <button type="button" class="t-btn active" data-value="cash" onclick="selectPaymentMethod(this)">💵 كاش</button>
                        <button type="button" class="t-btn" data-value="visa" onclick="selectPaymentMethod(this)">💳 فيزا</button>
                    </div>

                    <div style="background:#181822; padding:6px; border-radius:8px; border:1px solid var(--card-border); margin:4px 0;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                            <span style="font-size:0.72rem; color:var(--gold-bright); font-weight:bold;">الخصومات:</span>
                            <span id="discountStatusText" style="font-size:0.7rem; color:var(--success); display:none;"></span>
                        </div>
                        <div style="display:flex; gap:3px;">
                            <button type="button" onclick="applyDiscountPrompt('pct')" class="gold-btn" style="padding:3px; font-size:0.68rem; background:#222; color:#fff; border:1px solid #444; flex:1;">% نسبة</button>
                            <button type="button" onclick="applyDiscountPrompt('amt')" class="gold-btn" style="padding:3px; font-size:0.68rem; background:#222; color:#fff; border:1px solid #444; flex:1;">💵 مبلغ</button>
                            <button type="button" onclick="applyCouponCode()" class="gold-btn" style="padding:3px; font-size:0.68rem; background:var(--purple-accent); color:#fff; flex:1;">🎟️ كوبون</button>
                            <button type="button" onclick="clearDiscount()" title="إلغاء الخصم" class="gold-btn" style="padding:3px 6px; background:var(--danger); color:#fff; width:auto; font-size:0.72rem;">✕</button>
                        </div>
                    </div>

                    <div id="posCartList" class="cart-items-scroll">
                        <p style="text-align:center; color:#666; font-size:0.8rem; padding:20px;">السلة فارغة حالياً</p>
                    </div>

                    <div style="border-top:1px solid var(--card-border); padding-top:6px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:1.05rem; font-weight:900;">
                            <span>المجموع الكلي:</span>
                            <span id="posTotalAmount" style="color:var(--gold-bright);">0 د.ع</span>
                        </div>
                        <button type="button" onclick="prepareAndOpenPrintModal()" class="gold-btn" style="padding:8px; font-size:0.9rem; margin-bottom:4px;">
                            <i class="fa-solid fa-calculator"></i> حساب وطباعة الفاتورة
                        </button>
                        <button type="button" onclick="clearPosCart()" class="gold-btn" style="background:var(--danger); color:#fff; padding:5px; font-size:0.75rem;">إلغاء السلة</button>
                    </div>
                </div>
            </aside>

            <!-- 📦 قسم الوجبات والأقسام المستقلة المباشرة -->
            <main class="pos-main">
                <input type="text" id="posSearchInput" class="gold-input-inline" placeholder="🔍 بحث سريع عن وجبة..." oninput="filterPosProducts()">
                <div id="posCategoriesBar" class="categories-chips"></div>
                <div id="posProductsGrid" class="products-grid"></div>
            </main>
        </div>
    </div>

    <!-- 🛵 نافذة كشف وإدارة السائقين -->
    <div id="driverAccountModal" class="modal-overlay">
        <div class="modal-body" style="text-align:right; max-width:460px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #333; padding-bottom:8px;">
                <h3 style="color:var(--gold-bright); font-size:1.1rem;"><i class="fa-solid fa-motorcycle"></i> كشف وإدارة السائقين</h3>
                <button type="button" onclick="closeModal('driverAccountModal')" style="background:none; border:none; color:#fff;">✕</button>
            </div>

            <div style="background:#181822; padding:8px; border-radius:10px; margin-bottom:10px; border:1px solid #333;">
                <span style="font-size:0.75rem; color:var(--gold-bright); display:block; margin-bottom:4px; font-weight:bold;">➕ إضافة سائق جديد:</span>
                <div style="display:flex; gap:6px;">
                    <input type="text" id="newDriverNameInput" class="gold-input-inline" placeholder="اسم السائق..." style="padding:6px; font-size:0.8rem;">
                    <button type="button" onclick="addNewDriverToList()" class="gold-btn" style="width:auto; padding:6px 12px; font-size:0.8rem;">إضافة</button>
                </div>
            </div>

            <label style="font-size:0.8rem; color:#aaa; margin-bottom:4px; display:block;">اختر السائق:</label>
            <div style="display:flex; gap:6px; margin-bottom:12px;">
                <select id="driverAccountSelect" class="gold-input-inline" onchange="calculateDriverBalance()" style="font-weight:bold;"></select>
                <button type="button" onclick="deleteCurrentSelectedDriver()" class="gold-btn" style="width:auto; background:var(--danger); color:#fff; padding:6px 10px;">🗑️</button>
            </div>

            <div style="background:#121215; padding:12px; border-radius:10px; border:1px solid var(--card-border); margin-bottom:12px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem;">
                    <span>عدد الطلبات:</span><strong id="driverOrdersCount" style="color:#fff;">0</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem;">
                    <span>مجموع الوجبات:</span><strong id="driverMealsTotal" style="color:var(--gold-bright);">0 د.ع</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem;">
                    <span>أجور التوصيل:</span><strong id="driverDeliveryFeesTotal" style="color:var(--success);">0 د.ع</strong>
                </div>
                <hr style="border-color:#333; margin:8px 0;">
                <div style="display:flex; justify-content:space-between; font-size:1.05rem; font-weight:900;">
                    <span>الصافي المطلوب:</span><strong id="driverFinalDue" style="color:var(--gold-bright);">0 د.ع</strong>
                </div>
            </div>
            
            <div style="display:flex; gap:6px;">
                <button type="button" class="gold-btn" onclick="printDriverReceipt()"><i class="fa-solid fa-print"></i> طباعة الكشف</button>
                <button type="button" class="gold-btn" onclick="zeroOutDriverBalance()" style="background:var(--danger); color:#fff;"><i class="fa-solid fa-check-double"></i> تصفير الحساب</button>
            </div>
        </div>
    </div>

    <!-- 🖨️ نافذة الطباعة -->
    <div id="printOptionsModal" class="modal-overlay">
        <div class="modal-body" style="text-align:center;">
            <h3 style="color:var(--gold-bright); margin-bottom:12px;"><i class="fa-solid fa-print"></i> طباعة الفواتير</h3>
            <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:15px;">
                <button type="button" class="gold-btn" onclick="executeCustomerPrintOnly()">🧾 فاتورة الكاشير</button>
                <button type="button" class="gold-btn" onclick="executeKitchenPrintOnly()" style="background:#3b82f6; color:#fff;">🍳 أمر المطبخ</button>
            </div>
            <div style="display:flex; gap:8px;">
                <button type="button" class="gold-btn" onclick="tryFinalizeAndClearOrder()" style="background:var(--success); color:#fff; flex:2;">إتمام وتفريغ الطلب ✅</button>
                <button type="button" class="gold-btn" onclick="closeModal('printOptionsModal')" style="background:var(--danger); color:#fff; flex:1;">إلغاء</button>
            </div>
        </div>
    </div>

    <iframe id="drawerPrintFrame"></iframe>

    <script src="app.js"></script>
    <script>
        let posCart = [];
        let selectedPosOrderType = 'dine_in';
        let selectedPosPaymentMethod = 'cash';
        let posDiscountAmount = 0;
        let activeDriverOrders = [];

        // الأقسام المستقلة الثابتة المطلوبة
        const MASTER_CATEGORIES = [
            { id: 'cat_burger_meat', name: 'بركر لحم 🥩' },
            { id: 'cat_burger_chick', name: 'بركر دجاج 🍗' },
            { id: 'cat_kentucky', name: 'الكنتاكي والكرسبي 🍗' },
            { id: 'cat_rizo', name: 'الريزو 🍚' },
            { id: 'cat_finger', name: 'الفنكر والبطاطا 🍟' },
            { id: 'cat_sauces', name: 'الصوصات 🥣' },
            { id: 'cat_drinks', name: 'الببسي والمشروبات 🥤' },
            { id: 'cat_shawarma', name: 'الشاورما والصاج 🌯' }
        ];

        function cleanPrice(v) {
            if (!v) return 0;
            if (typeof v === 'number') return isNaN(v) ? 0 : v;
            let str = String(v).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d]/g, '');
            let num = parseInt(str, 10);
            return isNaN(num) ? 0 : num;
        }

        function toggleSideDrawer() {
            const drawer = document.getElementById('sideDrawer');
            const overlay = document.getElementById('drawerOverlay');
            if (!drawer || !overlay) return;
            drawer.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function openCashDrawerDirect() {
            const frame = document.getElementById('drawerPrintFrame');
            if (!frame) return;
            const doc = frame.contentWindow.document;
            doc.open();
            doc.write(`<html><head><style>@page { size: 80mm 30mm; margin: 0; }</style></head><body onload="window.print()"><div style="text-align:center; padding:10px;"><p style="font-size:10px;">=== MIM89 POS OPEN DRAWER ===</p></div></body></html>`);
            doc.close();
        }

        function cleanOldStorageAndReload() {
            localStorage.removeItem('sys_categories');
            localStorage.removeItem('sys_banners');
            location.reload();
        }

        function selectOrderType(btn) {
            document.querySelectorAll('#posOrderTypeGroup .t-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedPosOrderType = btn.getAttribute('data-value');
            document.getElementById('driverSelectBox').style.display = (selectedPosOrderType === 'delivery') ? 'block' : 'none';
        }

        function selectPaymentMethod(btn) {
            document.querySelectorAll('#posPaymentGroup .t-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedPosPaymentMethod = btn.getAttribute('data-value');
        }

        function populateDriversList() {
            const select1 = document.getElementById('posDriverSelect');
            const select2 = document.getElementById('driverAccountSelect');
            let drivers = [];
            try { drivers = JSON.parse(localStorage.getItem('sys_drivers') || '[]'); } catch(e){}
            if (drivers.length === 0) drivers = [{ name: 'سائق 1' }, { name: 'سائق 2' }];

            const html = drivers.map(d => `<option value="${d.name}">${d.name}</option>`).join('');
            if (select1) select1.innerHTML = html;
            if (select2) select2.innerHTML = html;
        }

        function addNewDriverToList() {
            const input = document.getElementById('newDriverNameInput');
            const name = input?.value.trim();
            if (!name) return alert("⚠️ اكتب اسم السائق أولاً!");

            let drivers = JSON.parse(localStorage.getItem('sys_drivers') || '[]');
            if (drivers.some(d => d.name === name)) return alert("⚠️ هذا السائق موجود بالفعل!");

            drivers.push({ name: name });
            localStorage.setItem('sys_drivers', JSON.stringify(drivers));
            input.value = '';
            populateDriversList();
            calculateDriverBalance();
        }

        function deleteCurrentSelectedDriver() {
            const select = document.getElementById('driverAccountSelect');
            const name = select?.value;
            if (!name) return;
            if (!confirm(`هل أنت ألكيد من حذف السائق (${name})؟`)) return;

            let drivers = JSON.parse(localStorage.getItem('sys_drivers') || '[]');
            drivers = drivers.filter(d => d.name !== name);
            localStorage.setItem('sys_drivers', JSON.stringify(drivers));
            populateDriversList();
            calculateDriverBalance();
        }

        // 🧠 خوارزمية فرز المواد حسب أسمائها وتفريغ العروض
        function getItemCategoryKey(item) {
            const name = (item.name || '').toLowerCase();
            if (name.includes('ريزو')) return 'cat_rizo';
            if (name.includes('كنتاكي') || name.includes('ستريبس') || name.includes('كرسبي') || name.includes('سكالوب')) return 'cat_kentucky';
            if (name.includes('لحم') || name.includes('لحوم')) return 'cat_burger_meat';
            if (name.includes('دجاج') && (name.includes('بركر') || name.includes('برجر'))) return 'cat_burger_chick';
            if (name.includes('فنگر') || name.includes('فنكر') || name.includes('بطاطا')) return 'cat_finger';
            if (name.includes('صوص') || name.includes('ثوم') || name.includes('كاتشب')) return 'cat_sauces';
            if (name.includes('ببسي') || name.includes('مشروب') || name.includes('ماء') || name.includes('سفن')) return 'cat_drinks';
            return 'cat_shawarma';
        }

        function loadPosDirectMenu(catId = 'all') {
            let items = [];
            if (typeof getData === 'function') items = getData('sys_items');
            else try { items = JSON.parse(localStorage.getItem('sys_items')) || []; } catch(e){}

            const catBar = document.getElementById('posCategoriesBar');
            const grid = document.getElementById('posProductsGrid');

            if (catBar) {
                let barHtml = `<button type="button" class="chip-tab ${catId === 'all' ? 'active' : ''}" onclick="loadPosDirectMenu('all')">الكل 🍔</button>`;
                MASTER_CATEGORIES.forEach(c => {
                    barHtml += `<button type="button" class="chip-tab ${catId === c.id ? 'active' : ''}" onclick="loadPosDirectMenu('${c.id}')">${c.name}</button>`;
                });
                catBar.innerHTML = barHtml;
            }

            let filtered = items;
            if (catId !== 'all') filtered = items.filter(i => getItemCategoryKey(i) === catId);

            if (!grid) return;
            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color:#aaa; grid-column:1/-1; text-align:center; padding:30px;">لا توجد وجبات في هذا القسم</p>`;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="product-card" onclick="addToPosCart(${item.id})">
                    <img src="${item.image || item.img || 'https://via.placeholder.com/120?text=MIM89'}" onerror="this.onerror=null; this.src='https://via.placeholder.com/120?text=MIM89';">
                    <h4 style="font-size:0.78rem; color:#fff; margin:2px 0; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.name}</h4>
                    <span style="font-size:0.8rem; color:var(--gold-bright); font-weight:bold;">${cleanPrice(item.price).toLocaleString('ar-IQ')} د.ع</span>
                </div>
            `).join('');
        }

        function filterPosProducts() {
            const query = document.getElementById('posSearchInput').value.trim().toLowerCase();
            let items = [];
            if (typeof getData === 'function') items = getData('sys_items');
            else items = JSON.parse(localStorage.getItem('sys_items') || '[]');

            const grid = document.getElementById('posProductsGrid');
            const filtered = items.filter(i => (i.name || '').toLowerCase().includes(query));

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color:#aaa; grid-column:1/-1; text-align:center; padding:30px;">لا توجد نتائج مطابقة</p>`;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="product-card" onclick="addToPosCart(${item.id})">
                    <img src="${item.image || item.img || 'https://via.placeholder.com/120?text=MIM89'}" onerror="this.onerror=null; this.src='https://via.placeholder.com/120?text=MIM89';">
                    <h4 style="font-size:0.78rem; color:#fff; margin:2px 0; font-weight:800;">${item.name}</h4>
                    <span style="font-size:0.8rem; color:var(--gold-bright); font-weight:bold;">${cleanPrice(item.price).toLocaleString('ar-IQ')} د.ع</span>
                </div>
            `).join('');
        }

        function addToPosCart(itemId) {
            let items = [];
            if (typeof getData === 'function') items = getData('sys_items');
            else items = JSON.parse(localStorage.getItem('sys_items') || '[]');

            const item = items.find(i => cleanPrice(i.id) === cleanPrice(itemId));
            if (!item) return;

            const existing = posCart.find(i => cleanPrice(i.id) === cleanPrice(itemId));
            if (existing) existing.qty += 1;
            else posCart.push({ id: item.id, name: item.name, price: cleanPrice(item.price), qty: 1 });
            renderPosCart();
        }

        function renderPosCart() {
            const listContainer = document.getElementById('posCartList');
            const totalEl = document.getElementById('posTotalAmount');
            if (!listContainer) return;

            if (posCart.length === 0) {
                listContainer.innerHTML = `<p style="text-align:center; color:#666; font-size:0.8rem; padding:20px;">السلة فارغة حالياً</p>`;
                if (totalEl) totalEl.innerText = "0 د.ع";
                return;
            }

            const subtotal = posCart.reduce((sum, i) => sum + (cleanPrice(i.price) * cleanPrice(i.qty)), 0);
            const finalTotal = Math.max(0, subtotal - posDiscountAmount);

            listContainer.innerHTML = posCart.map((item, index) => `
                <div class="cart-item-row">
                    <div>
                        <div style="font-size:0.78rem; color:#fff; font-weight:800;">${item.name}</div>
                        <div style="font-size:0.72rem; color:var(--gold-bright);">${(cleanPrice(item.price) * cleanPrice(item.qty)).toLocaleString('ar-IQ')} د.ع</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <button type="button" onclick="updateCartQty(${index}, -1)" style="background:#222; color:var(--gold-bright); border:1px solid var(--gold-primary); width:24px; height:24px; border-radius:4px;">-</button>
                        <span style="font-size:0.85rem; font-weight:800; color:#fff;">${item.qty}</span>
                        <button type="button" onclick="updateCartQty(${index}, 1)" style="background:var(--gold-primary); color:#000; border:none; width:24px; height:24px; border-radius:4px;">+</button>
                    </div>
                </div>
            `).join('');

            if (totalEl) totalEl.innerText = finalTotal.toLocaleString('ar-IQ') + " د.ع";
        }

        function updateCartQty(index, change) {
            if (posCart[index]) {
                posCart[index].qty += change;
                if (posCart[index].qty <= 0) posCart.splice(index, 1);
            }
            renderPosCart();
        }

        function clearPosCart() { posCart = []; posDiscountAmount = 0; renderPosCart(); }

        function applyDiscountPrompt(type) {
            const subtotal = posCart.reduce((sum, i) => sum + (cleanPrice(i.price) * cleanPrice(i.qty)), 0);
            if (subtotal === 0) return alert("⚠️ السلة فارغة!");
            if (type === 'pct') {
                const val = prompt("نسبة الخصم (%):", "10");
                if (val) posDiscountAmount = Math.round((subtotal * parseFloat(val)) / 100);
            } else if (type === 'amt') {
                const val = prompt("مبلغ الخصم (دينار):", "1000");
                if (val) posDiscountAmount = cleanPrice(val);
            }
            renderPosCart();
        }

        function applyCouponCode() {
            const inputCode = prompt("أدخل الكود:")?.trim().toUpperCase();
            if (!inputCode) return;
            posDiscountAmount = 1000;
            renderPosCart();
        }

        function clearDiscount() { posDiscountAmount = 0; renderPosCart(); }

        function openDriverAccountModal() { populateDriversList(); calculateDriverBalance(); openModal('driverAccountModal'); }

        function calculateDriverBalance() {
            const driverName = document.getElementById('driverAccountSelect')?.value;
            let completedOrders = [];
            try { completedOrders = JSON.parse(localStorage.getItem('sys_completed_orders') || '[]'); } catch(e){}
            activeDriverOrders = completedOrders.filter(o => o.driverName === driverName && !o.isSettled);

            const count = activeDriverOrders.length;
            const mealsTotal = activeDriverOrders.reduce((sum, o) => sum + cleanPrice(o.subtotal || o.totalAmount), 0);
            const deliveryFees = activeDriverOrders.reduce((sum, o) => sum + cleanPrice(o.deliveryFee || 2500), 0);

            document.getElementById('driverOrdersCount').innerText = `${count}`;
            document.getElementById('driverMealsTotal').innerText = `${mealsTotal.toLocaleString('ar-IQ')} د.ع`;
            document.getElementById('driverDeliveryFeesTotal').innerText = `${deliveryFees.toLocaleString('ar-IQ')} د.ع`;
            document.getElementById('driverFinalDue').innerText = `${(mealsTotal + deliveryFees).toLocaleString('ar-IQ')} د.ع`;
        }

        function zeroOutDriverBalance() {
            const driverName = document.getElementById('driverAccountSelect')?.value;
            if (activeDriverOrders.length === 0) return alert("⚠️ لا توجد طلبات لتصفيرها!");
            if (!confirm(`تأكيد تصفير حساب السائق (${driverName})؟`)) return;

            let completedOrders = JSON.parse(localStorage.getItem('sys_completed_orders') || '[]');
            completedOrders.forEach(o => { if (o.driverName === driverName && !o.isSettled) o.isSettled = true; });
            localStorage.setItem('sys_completed_orders', JSON.stringify(completedOrders));
            calculateDriverBalance();
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function prepareAndOpenPrintModal() { if (posCart.length === 0) return alert("⚠️ السلة فارغة!"); openModal('printOptionsModal'); }
        function executeCustomerPrintOnly() { window.print(); }
        function executeKitchenPrintOnly() { window.print(); }
        function tryFinalizeAndClearOrder() { clearPosCart(); closeModal('printOptionsModal'); }

        document.addEventListener('DOMContentLoaded', () => {
            populateDriversList();
            loadPosDirectMenu('all');
        });
    </script>
</body>
</html>
