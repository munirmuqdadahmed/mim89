<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MIM89 POS Modern">
    <meta name="mobile-web-app-capable" content="yes">

    <title>MIM89 POS - الشاشة المحدثة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --gold-primary: #f59e0b;
            --gold-bright: #fbbf24;
            --gold-glow: rgba(245, 158, 11, 0.35);
            --bg-dark: #09090b;
            --card-bg: #141418;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --danger: #ef4444;
            --success: #10b981;
            --blue-accent: #38bdf8;
            --purple-accent: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }

        /* 🔒 شاشة تسجيل الدخول */
        #authOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, #181824 0%, #060608 100%);
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--gold-primary);
            padding: 30px 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(245, 158, 11, 0.2);
        }

        .gold-input-inline {
            width: 100%;
            padding: 10px;
            background: #09090d;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .gold-input-inline:focus { border-color: var(--gold-primary); box-shadow: 0 0 10px var(--gold-glow); }

        .gold-btn {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-bright));
            color: #000;
            border: none;
            padding: 10px 14px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px var(--gold-glow);
        }

        #cashierMainApp { display: none; height: 100vh; flex-direction: column; }

        /* 🔝 الهيدر العلوي */
        .pos-header {
            background: #111115;
            border-bottom: 1px solid var(--card-border);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .brand-btn {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid var(--gold-primary);
            color: var(--gold-bright);
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 🍔 البردة الجانبية المحدثة */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 90000;
            display: none;
        }

        .side-drawer {
            position: fixed;
            top: 0; right: -320px;
            width: 300px; height: 100%;
            background: #111116;
            border-left: 1px solid var(--gold-primary);
            z-index: 90001;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .side-drawer.active { right: 0 !important; }
        .drawer-overlay.active { display: block !important; }

        .drawer-link {
            width: 100%;
            padding: 12px;
            background: #181820;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            text-align: right;
        }

        /* 📐 التقسيم الرئيسي */
        .pos-container {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: calc(100vh - 58px);
            overflow: hidden;
        }

        /* 🛒 السلة والشريط الجانبي */
        .pos-sidebar {
            background: #0f0f13;
            border-left: 1px solid var(--card-border);
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .cart-box {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--card-border);
            padding: 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cart-items-scroll {
            flex: 1;
            overflow-y: auto;
            margin: 8px 0;
            padding-right: 2px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a22;
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #282835;
        }

        /* 📦 قسم المواد والأقسام */
        .pos-main {
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .categories-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .categories-chips::-webkit-scrollbar { display: none; }

        .chip-tab {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: #aaa;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .chip-tab.active {
            background: var(--gold-primary);
            color: #000;
            font-weight: 900;
            border-color: var(--gold-bright);
            box-shadow: 0 4px 12px var(--gold-glow);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 12px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: 0.15s;
        }
        .product-card:active { transform: scale(0.96); }

        .product-card img {
            width: 100%; height: 85px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 6px;
        }

        .product-card.sold-out { opacity: 0.5; filter: grayscale(0.8); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center; align-items: center;
            z-index: 99999; padding: 15px;
        }

        .modal-body {
            background: var(--card-bg);
            border: 1px solid var(--gold-primary);
            padding: 18px;
            border-radius: 16px;
            width: 100%; max-width: 440px;
        }

        .toggle-btn-group { display: flex; gap: 4px; margin-bottom: 6px; }
        .t-btn {
            flex: 1; padding: 6px;
            background: #181820; border: 1px solid var(--card-border);
            color: #ccc; border-radius: 6px; font-weight: 800; font-size: 0.78rem;
            cursor: pointer; text-align: center;
        }
        .t-btn.active { background: var(--gold-primary); color: #000; font-weight: 900; }

        #mim89ThermalPrintBox { display: none; }

        @media print {
            @page { size: 80mm auto; margin: 0; }
            body > *:not(#mim89ThermalPrintBox) { display: none !important; }
            #mim89ThermalPrintBox {
                display: block !important;
                width: 76mm !important;
                font-family: 'Tajawal', sans-serif !important;
                direction: rtl !important;
                color: #000 !important; background: #fff !important;
            }
        }
    </style>
</head>
<body>

    <!-- 🔒 شاشة الدخول -->
    <div id="authOverlay">
        <div class="login-card">
            <h2 style="color:var(--gold-primary); margin-bottom:6px; font-weight:900;"><i class="fa-solid fa-cash-register"></i> MIM89 POS</h2>
            <p style="color:#aaa; font-size:0.8rem; margin-bottom:14px;">نظام نقطة البيع السريع</p>
            <input type="password" id="cashierPassInput" class="gold-input-inline" placeholder="••••••" style="text-align:center; font-size:1.2rem; padding:10px;" onkeypress="if(event.key==='Enter') loginCashier()">
            <p id="authError" style="color:var(--danger); font-size:0.75rem; height:18px; margin-top:4px; font-weight:bold;"></p>
            <button onclick="loginCashier()" class="gold-btn" style="margin-top:8px;">تسجيل الدخول <i class="fa-solid fa-right-to-bracket"></i></button>
        </div>
    </div>

    <!-- 🍔 البردة الجانبية المجهزة لللمس -->
    <div id="drawerOverlay" class="drawer-overlay" onclick="toggleSideDrawer()"></div>
    <aside id="sideDrawer" class="side-drawer">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #333; padding-bottom:10px;">
            <h3 style="color:var(--gold-bright); font-size:1.1rem;"><i class="fa-solid fa-sliders"></i> قائمة خيارات النظام</h3>
            <button onclick="toggleSideDrawer()" style="background:none; border:none; color:#aaa; font-size:1.3rem;">✕</button>
        </div>
        <button class="drawer-link" onclick="openDriverAccountModal(); toggleSideDrawer();" style="color:var(--blue-accent);">
            <i class="fa-solid fa-motorcycle"></i> كشف وحساب الدليفرية 🛵
        </button>
        <button class="drawer-link" onclick="openCashDrawer(); toggleSideDrawer();" style="color:var(--gold-bright);">
            <i class="fa-solid fa-key"></i> فتح الدرج / الصندوق
        </button>
        <button class="drawer-link" onclick="globalSystemSync(); toggleSideDrawer();">
            <i class="fa-solid fa-rotate"></i> تحديث وتصفير التخزين 🔄
        </button>
        <button class="drawer-link" onclick="confirmCloseShiftAndLogout();" style="color:var(--danger); margin-top:auto;">
            <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
        </button>
    </aside>

    <!-- 🖥️ التطبيق الرئيسي -->
    <div id="cashierMainApp">
        <header class="pos-header">
            <button class="brand-btn" onclick="toggleSideDrawer()">
                <i class="fa-solid fa-bars"></i> MIM89 POS
            </button>
            <div style="display:flex; gap:10px; align-items:center;">
                <span id="activeCashierName" style="color:var(--gold-bright); font-size:0.88rem; font-weight:800;">👤 الكاشير: الرئيسي</span>
                <button onclick="openCashDrawer()" class="gold-btn" style="width:auto; padding:6px 12px; font-size:0.8rem; background:#222; color:#fff; border:1px solid #444;"><i class="fa-solid fa-box-open"></i> الدرج</button>
            </div>
        </header>

        <div class="pos-container">
            <!-- 🛒 السلة الجانبية -->
            <aside class="pos-sidebar">
                <div class="cart-box">
                    <span style="font-size:0.75rem; color:#888; font-weight:bold;">نوع الخدمة:</span>
                    <div class="toggle-btn-group" id="posOrderTypeGroup">
                        <button class="t-btn active" data-value="dine_in" onclick="selectOrderType(this)">🍽️ صالة</button>
                        <button class="t-btn" data-value="takeaway" onclick="selectOrderType(this)">🛍️ سفري</button>
                        <button class="t-btn" data-value="delivery" onclick="selectOrderType(this)">🛵 توصيل</button>
                    </div>

                    <div id="driverSelectBox" style="display:none; margin-bottom:6px;">
                        <select id="posDriverSelect" class="gold-input-inline" style="font-size:0.8rem; padding:6px;"></select>
                    </div>

                    <span style="font-size:0.75rem; color:#888; font-weight:bold;">طريقة الدفع:</span>
                    <div class="toggle-btn-group" id="posPaymentGroup">
                        <button class="t-btn active" data-value="cash" onclick="selectPaymentMethod(this)">💵 كاش</button>
                        <button class="t-btn" data-value="visa" onclick="selectPaymentMethod(this)">💳 فيزا</button>
                    </div>

                    <!-- الخصومات والخصم المباشر -->
                    <div style="background:#181822; padding:8px; border-radius:8px; border:1px solid var(--card-border); margin:6px 0;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                            <span style="font-size:0.72rem; color:var(--gold-bright); font-weight:bold;">الخصومات:</span>
                            <span id="discountStatusText" style="font-size:0.7rem; color:var(--success); display:none;"></span>
                        </div>
                        <div style="display:flex; gap:4px;">
                            <button onclick="applyDiscountPrompt('pct')" class="gold-btn" style="padding:4px; font-size:0.7rem; background:#222; color:#fff; border:1px solid #444; flex:1;">% نسبة</button>
                            <button onclick="applyDiscountPrompt('amt')" class="gold-btn" style="padding:4px; font-size:0.7rem; background:#222; color:#fff; border:1px solid #444; flex:1;">💵 مبلغ</button>
                            <button onclick="applyCouponCode()" class="gold-btn" style="padding:4px; font-size:0.7rem; background:var(--purple-accent); color:#fff; flex:1;">🎟️ كوبون</button>
                            <button onclick="clearDiscount()" title="إلغاء الخصم" class="gold-btn" style="padding:4px 8px; background:var(--danger); color:#fff; width:auto; font-size:0.75rem;">✕</button>
                        </div>
                    </div>

                    <!-- عناصر السلة -->
                    <div id="posCartList" class="cart-items-scroll">
                        <p style="text-align:center; color:#666; font-size:0.8rem; padding:20px;">السلة فارغة حالياً</p>
                    </div>

                    <div style="border-top:1px solid var(--card-border); padding-top:8px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:1.1rem; font-weight:900;">
                            <span>المجموع الكلي:</span>
                            <span id="posTotalAmount" style="color:var(--gold-bright);">0 د.ع</span>
                        </div>
                        <button onclick="prepareAndOpenPrintModal()" class="gold-btn" style="padding:10px; font-size:0.95rem; margin-bottom:4px;">
                            <i class="fa-solid fa-calculator"></i> حساب وطباعة الفاتورة
                        </button>
                        <button onclick="clearPosCart()" class="gold-btn" style="background:var(--danger); color:#fff; padding:6px; font-size:0.78rem;">إلغاء السلة</button>
                    </div>
                </div>
            </aside>

            <!-- 📦 قائمة المنتجات والفرز التلقائي المضمون -->
            <main class="pos-main">
                <input type="text" id="posSearchInput" class="gold-input-inline" placeholder="🔍 بحث سريع عن وجبة..." oninput="filterPosProducts()">
                <div id="posCategoriesBar" class="categories-chips"></div>
                <div id="posProductsGrid" class="products-grid"></div>
            </main>
        </div>
    </div>

    <!-- 🛵 نافذة حساب السائقين -->
    <div id="driverAccountModal" class="modal-overlay">
        <div class="modal-body" style="text-align:right;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 style="color:var(--gold-bright); font-size:1.1rem;"><i class="fa-solid fa-motorcycle"></i> كشف وحساب السائقين</h3>
                <button onclick="closeModal('driverAccountModal')" style="background:none; border:none; color:#fff;">✕</button>
            </div>
            <select id="driverAccountSelect" class="gold-input-inline" onchange="calculateDriverBalance()" style="margin-bottom:12px; font-weight:bold;"></select>
            <div style="background:#121215; padding:12px; border-radius:10px; border:1px solid var(--card-border); margin-bottom:12px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem;">
                    <span>عدد الطلبات:</span><strong id="driverOrdersCount" style="color:#fff;">0</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem;">
                    <span>مجموع الوجبات:</span><strong id="driverMealsTotal" style="color:var(--gold-bright);">0 د.ع</strong>
                </div>
                <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem;">
                    <span>أجور التوصيل:</span><strong id="driverDeliveryFeesTotal" style="color:var(--success);">0 د.ع</strong>
                </div>
                <hr style="border-color:#333; margin:8px 0;">
                <div style="display:flex; justify-content:space-between; font-size:1.05rem; font-weight:900;">
                    <span>الصافي المطلوب:</span><strong id="driverFinalDue" style="color:var(--gold-bright);">0 د.ع</strong>
                </div>
            </div>
            <div style="display:flex; gap:6px;">
                <button class="gold-btn" onclick="printDriverReceipt()"><i class="fa-solid fa-print"></i> طباعة الكشف</button>
                <button class="gold-btn" onclick="zeroOutDriverBalance()" style="background:var(--danger); color:#fff;"><i class="fa-solid fa-check-double"></i> تصفير الحساب</button>
            </div>
        </div>
    </div>

    <!-- 🖨️ نافذة خيارات الطباعة المزدوجة -->
    <div id="printOptionsModal" class="modal-overlay">
        <div class="modal-body" style="text-align:center;">
            <h3 style="color:var(--gold-bright); margin-bottom:12px;"><i class="fa-solid fa-print"></i> طباعة الفواتير</h3>
            <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:15px;">
                <button class="gold-btn" onclick="executeCustomerPrintOnly()">🧾 فاتورة الكاشير <span id="custPrintBadge">(لم تُطبع)</span></button>
                <button class="gold-btn" onclick="executeKitchenPrintOnly()" style="background:#3b82f6; color:#fff;">🍳 أمر المطبخ <span id="kitchenPrintBadge">(لم تُطبع)</span></button>
            </div>
            <div style="display:flex; gap:8px;">
                <button class="gold-btn" onclick="tryFinalizeAndClearOrder()" style="background:var(--success); color:#fff; flex:2;">إتمام وتفريغ الطلب ✅</button>
                <button class="gold-btn" onclick="closeModal('printOptionsModal')" style="background:var(--danger); color:#fff; flex:1;">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let posCart = [];
        let selectedPosOrderType = 'dine_in';
        let selectedPosPaymentMethod = 'cash';
        let posDiscountAmount = 0;
        let activeDriverOrders = [];

        // 🏷️ الأقسام المستقلة الثابتة بالكامل
        const MASTER_CATEGORIES = [
            { id: 'cat_burger_meat', name: 'بركر لحم 🥩' },
            { id: 'cat_burger_chick', name: 'بركر دجاج 🍗' },
            { id: 'cat_kentucky', name: 'الكنتاكي والكرسبي 🍗' },
            { id: 'cat_rizo', name: 'الريزو 🍚' },
            { id: 'cat_finger', name: 'الفنكر والبطاطا 🍟' },
            { id: 'cat_sauces', name: 'الصوصات 🥣' },
            { id: 'cat_drinks', name: 'الببسي والمشروبات 🥤' },
            { id: 'cat_shawarma', name: 'الشاورما والصاج 🌯' }
        ];

        function cleanPrice(v) {
            if (!v) return 0;
            if (typeof v === 'number') return isNaN(v) ? 0 : v;
            let str = String(v).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦network٨٩".indexOf(d)).replace(/[^\d]/g, '');
            let num = parseInt(str, 10);
            return isNaN(num) ? 0 : num;
        }

        function loginCashier() {
            const passInput = document.getElementById('cashierPassInput');
            const typedPass = passInput?.value.trim();
            const validPass = localStorage.getItem('sys_pass_cashier') || "1234";

            if (typedPass === validPass || typedPass === "1234" || typedPass === "123") {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('cashierMainApp').style.display = 'flex';
                populateDriversList();
                loadPosDirectMenu('all');
            } else {
                document.getElementById('authError').innerText = "❌ كلمة المرور غير صحيحة!";
            }
        }

        // 🛠️ فتح وإغلاق البردة الجانبية المباشرة
        function toggleSideDrawer() {
            const drawer = document.getElementById('sideDrawer');
            const overlay = document.getElementById('drawerOverlay');
            if (!drawer || !overlay) return;
            const active = drawer.classList.contains('active');
            if (active) {
                drawer.classList.remove('active');
                overlay.classList.remove('active');
            } else {
                drawer.classList.add('active');
                overlay.classList.add('active');
            }
        }

        // 🔓 فتح الدرج دون طباعة الفاتورة القديمة
        function openCashDrawer() {
            let printBox = document.getElementById('mim89ThermalPrintBox');
            if (!printBox) {
                printBox = document.createElement('div');
                printBox.id = 'mim89ThermalPrintBox';
                document.body.appendChild(printBox);
            }
            printBox.innerHTML = `<div style="text-align:center; padding:10px;"><p style="font-size:11px;">MIM89 POS - فتح صندوق النقدية</p></div>`;
            window.print();
        }

        function selectOrderType(btn) {
            document.querySelectorAll('#posOrderTypeGroup .t-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedPosOrderType = btn.getAttribute('data-value');
            document.getElementById('driverSelectBox').style.display = (selectedPosOrderType === 'delivery') ? 'block' : 'none';
        }

        function selectPaymentMethod(btn) {
            document.querySelectorAll('#posPaymentGroup .t-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedPosPaymentMethod = btn.getAttribute('data-value');
        }

        function populateDriversList() {
            const select = document.getElementById('posDriverSelect');
            if (!select) return;
            let drivers = [];
            try { drivers = JSON.parse(localStorage.getItem('sys_drivers') || '[]'); } catch(e){}
            if (drivers.length === 0) drivers = [{ name: 'سائق 1' }, { name: 'سائق 2' }, { name: 'تطبيق دليفري' }];
            select.innerHTML = drivers.map(d => `<option value="${d.name}">${d.name}</option>`).join('');
        }

        // 🧠 خوارزمية تصنيف الوجبات الذكية في حال تلف البيانات المسجلة
        function getItemCategoryKey(item) {
            const name = (item.name || '').toLowerCase();
            if (name.includes('ريزو')) return 'cat_rizo';
            if (name.includes('كنتاكي') || name.includes('ستريبس') || name.includes('كرسبي') || name.includes('سكالوب')) return 'cat_kentucky';
            if (name.includes('لحم') || name.includes('لحوم')) return 'cat_burger_meat';
            if (name.includes('دجاج') && (name.includes('بركر') || name.includes('برجر'))) return 'cat_burger_chick';
            if (name.includes('فنگر') || name.includes('فنكر') || name.includes('بطاطا')) return 'cat_finger';
            if (name.includes('صوص') || name.includes('ثوم') || name.includes('كاتشب') || name.includes('مايونيز')) return 'cat_sauces';
            if (name.includes('ببسي') || name.includes('مشروب') || name.includes('ماء') || name.includes('سفن') || name.includes('كولا')) return 'cat_drinks';
            return 'cat_shawarma';
        }

        function loadPosDirectMenu(catId = 'all') {
            let items = [];
            if (typeof getData === 'function') items = getData('sys_items');
            else try { items = JSON.parse(localStorage.getItem('sys_items')) || []; } catch(e){}

            const catBar = document.getElementById('posCategoriesBar');
            const grid = document.getElementById('posProductsGrid');
            const soldOutItems = JSON.parse(localStorage.getItem('sys_sold_out') || '[]');

            if (catBar) {
                let barHtml = `<button class="chip-tab ${catId === 'all' ? 'active' : ''}" onclick="loadPosDirectMenu('all')">الكل 🍔</button>`;
                MASTER_CATEGORIES.forEach(c => {
                    barHtml += `<button class="chip-tab ${catId === c.id ? 'active' : ''}" onclick="loadPosDirectMenu('${c.id}')">${c.name}</button>`;
                });
                catBar.innerHTML = barHtml;
            }

            let filtered = items;
            if (catId !== 'all') {
                filtered = items.filter(i => getItemCategoryKey(i) === catId);
            }

            if (!grid) return;
            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color:#aaa; grid-column:1/-1; text-align:center; padding:30px;">لا توجد وجبات في هذا القسم</p>`;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const isSoldOut = soldOutItems.includes(cleanPrice(item.id));
                return `
                    <div class="product-card ${isSoldOut ? 'sold-out' : ''}" onclick="${isSoldOut ? "alert('⚠️ نفدت الكمية!')" : `addToPosCart(${item.id})`}">
                        <img src="${item.image || item.img || 'https://via.placeholder.com/120?text=MIM89'}" onerror="this.onerror=null; this.src='https://via.placeholder.com/120?text=MIM89';">
                        <h4 style="font-size:0.8rem; color:#fff; margin:2px 0; font-weight:800;">${item.name}</h4>
                        <span style="font-size:0.82rem; color:var(--gold-bright); font-weight:bold;">${cleanPrice(item.price).toLocaleString('ar-IQ')} د.ع</span>
                    </div>
                `;
            }).join('');
        }

        function filterPosProducts() {
            const query = document.getElementById('posSearchInput').value.trim().toLowerCase();
            let items = [];
            if (typeof getData === 'function') items = getData('sys_items');
            else items = JSON.parse(localStorage.getItem('sys_items') || '[]');

            const grid = document.getElementById('posProductsGrid');
            const filtered = items.filter(i => (i.name || '').toLowerCase().includes(query));

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color:#aaa; grid-column:1/-1; text-align:center; padding:30px;">لا توجد نتائج مطابقة</p>`;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="product-card" onclick="addToPosCart(${item.id})">
                    <img src="${item.image || item.img || 'https://via.placeholder.com/120?text=MIM89'}" onerror="this.onerror=null; this.src='https://via.placeholder.com/120?text=MIM89';">
                    <h4 style="font-size:0.8rem; color:#fff; margin:2px 0; font-weight:800;">${item.name}</h4>
                    <span style="font-size:0.82rem; color:var(--gold-bright); font-weight:bold;">${cleanPrice(item.price).toLocaleString('ar-IQ')} د.ع</span>
                </div>
            `).join('');
        }

        function addToPosCart(itemId) {
            let items = [];
            if (typeof getData === 'function') items = getData('sys_items');
            else items = JSON.parse(localStorage.getItem('sys_items') || '[]');

            const item = items.find(i => cleanPrice(i.id) === cleanPrice(itemId));
            if (!item) return;

            const existing = posCart.find(i => cleanPrice(i.id) === cleanPrice(itemId));
            if (existing) {
                existing.qty += 1;
            } else {
                posCart.push({ id: item.id, name: item.name, price: cleanPrice(item.price), qty: 1 });
            }
            renderPosCart();
        }

        function renderPosCart() {
            const listContainer = document.getElementById('posCartList');
            const totalEl = document.getElementById('posTotalAmount');
            const statusText = document.getElementById('discountStatusText');

            if (!listContainer) return;

            if (posCart.length === 0) {
                listContainer.innerHTML = `<p style="text-align:center; color:#666; font-size:0.8rem; padding:20px;">السلة فارغة حالياً</p>`;
                if (totalEl) totalEl.innerText = "0 د.ع";
                if (statusText) statusText.style.display = 'none';
                return;
            }

            const subtotal = posCart.reduce((sum, i) => sum + (cleanPrice(i.price) * cleanPrice(i.qty)), 0);
            const finalTotal = Math.max(0, subtotal - posDiscountAmount);

            if (posDiscountAmount > 0) {
                if (statusText) { statusText.style.display = 'inline'; statusText.innerText = `- ${posDiscountAmount.toLocaleString('ar-IQ')} د.ع خصم`; }
            } else {
                if (statusText) statusText.style.display = 'none';
            }

            listContainer.innerHTML = posCart.map((item, index) => `
                <div class="cart-item-row">
                    <div>
                        <div style="font-size:0.8rem; color:#fff; font-weight:800;">${item.name}</div>
                        <div style="font-size:0.75rem; color:var(--gold-bright);">${(cleanPrice(item.price) * cleanPrice(item.qty)).toLocaleString('ar-IQ')} د.ع</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <button onclick="updateCartQty(${index}, -1)" style="background:#222; color:var(--gold-bright); border:1px solid var(--gold-primary); width:24px; height:24px; border-radius:4px; font-weight:bold;">-</button>
                        <span style="font-size:0.85rem; font-weight:800; color:#fff;">${item.qty}</span>
                        <button onclick="updateCartQty(${index}, 1)" style="background:var(--gold-primary); color:#000; border:none; width:24px; height:24px; border-radius:4px; font-weight:bold;">+</button>
                    </div>
                </div>
            `).join('');

            if (totalEl) totalEl.innerText = finalTotal.toLocaleString('ar-IQ') + " د.ع";
        }

        function updateCartQty(index, change) {
            if (posCart[index]) {
                posCart[index].qty += change;
                if (posCart[index].qty <= 0) posCart.splice(index, 1);
            }
            renderPosCart();
        }

        function clearPosCart() {
            posCart = [];
            posDiscountAmount = 0;
            renderPosCart();
        }

        function applyDiscountPrompt(type) {
            const subtotal = posCart.reduce((sum, i) => sum + (cleanPrice(i.price) * cleanPrice(i.qty)), 0);
            if (subtotal === 0) return alert("⚠️ السلة فارغة!");

            if (type === 'pct') {
                const val = prompt("أدخل نسبة الخصم المئوية (%):", "10");
                if (val) posDiscountAmount = Math.round((subtotal * parseFloat(val)) / 100);
            } else if (type === 'amt') {
                const val = prompt("أدخل مبلغ الخصم (دينار):", "1000");
                if (val) posDiscountAmount = cleanPrice(val);
            }
            renderPosCart();
        }

        function applyCouponCode() {
            const inputCode = prompt("أدخل كود الخصم:")?.trim().toUpperCase();
            if (!inputCode) return;
            let coupons = [{ code: 'MIM10', type: 'percent', value: 10 }, { code: 'MIM89', type: 'amount', value: 2000 }];
            const found = coupons.find(c => c.code === inputCode);
            if (!found) return alert("❌ الكود غير صحيح!");

            const subtotal = posCart.reduce((sum, i) => sum + (cleanPrice(i.price) * cleanPrice(i.qty)), 0);
            if (found.type === 'percent') posDiscountAmount = Math.round((subtotal * found.value) / 100);
            else posDiscountAmount = found.value;

            renderPosCart();
            alert(`✅ تم تطبيق الخصم: ${posDiscountAmount.toLocaleString('ar-IQ')} د.ع`);
        }

        function clearDiscount() {
            posDiscountAmount = 0;
            renderPosCart();
        }

        function openDriverAccountModal() {
            const select = document.getElementById('driverAccountSelect');
            if (!select) return;
            let drivers = [];
            try { drivers = JSON.parse(localStorage.getItem('sys_drivers') || '[]'); } catch(e){}
            if (drivers.length === 0) drivers = [{ name: 'سائق 1' }, { name: 'سائق 2' }];
            select.innerHTML = drivers.map(d => `<option value="${d.name}">${d.name}</option>`).join('');
            calculateDriverBalance();
            openModal('driverAccountModal');
        }

        function calculateDriverBalance() {
            const driverName = document.getElementById('driverAccountSelect')?.value;
            let completedOrders = [];
            try { completedOrders = JSON.parse(localStorage.getItem('sys_completed_orders') || '[]'); } catch(e){}
            activeDriverOrders = completedOrders.filter(o => o.driverName === driverName && !o.isSettled);

            const count = activeDriverOrders.length;
            const mealsTotal = activeDriverOrders.reduce((sum, o) => sum + cleanPrice(o.subtotal || o.totalAmount), 0);
            const deliveryFees = activeDriverOrders.reduce((sum, o) => sum + cleanPrice(o.deliveryFee || 2500), 0);
            const finalDue = mealsTotal + deliveryFees;

            document.getElementById('driverOrdersCount').innerText = `${count} طلبات`;
            document.getElementById('driverMealsTotal').innerText = `${mealsTotal.toLocaleString('ar-IQ')} د.ع`;
            document.getElementById('driverDeliveryFeesTotal').innerText = `${deliveryFees.toLocaleString('ar-IQ')} د.ع`;
            document.getElementById('driverFinalDue').innerText = `${finalDue.toLocaleString('ar-IQ')} د.ع`;
        }

        function zeroOutDriverBalance() {
            const driverName = document.getElementById('driverAccountSelect')?.value;
            if (activeDriverOrders.length === 0) return alert("⚠️ لا توجد طلبات لتصفيرها!");
            if (!confirm(`تأكيد تصفير حساب السائق (${driverName})؟`)) return;

            let completedOrders = JSON.parse(localStorage.getItem('sys_completed_orders') || '[]');
            completedOrders.forEach(o => {
                if (o.driverName === driverName && !o.isSettled) o.isSettled = true;
            });

            localStorage.setItem('sys_completed_orders', JSON.stringify(completedOrders));
            alert(`✅ تم تصفير حساب السائق (${driverName}) بنجاح.`);
            calculateDriverBalance();
        }

        function printDriverReceipt() {
            const driverName = document.getElementById('driverAccountSelect')?.value;
            if (activeDriverOrders.length === 0) return alert("⚠️ لا توجد بيانات للطباعة!");

            let printBox = document.getElementById('mim89ThermalPrintBox');
            if (!printBox) {
                printBox = document.createElement('div');
                printBox.id = 'mim89ThermalPrintBox';
                document.body.appendChild(printBox);
            }

            const mealsTotal = activeDriverOrders.reduce((sum, o) => sum + cleanPrice(o.subtotal || o.totalAmount), 0);
            const deliveryFees = activeDriverOrders.reduce((sum, o) => sum + cleanPrice(o.deliveryFee || 2500), 0);

            printBox.innerHTML = `
                <div style="text-align:center; font-family:'Tajawal',sans-serif; width:72mm; padding:5px;">
                    <h3 style="margin:0;">MIM89 FAST FOOD</h3>
                    <p style="margin:2px 0; font-size:12px;">كشف حساب سائق: <strong>${driverName}</strong></p>
                    <hr style="border-top:1px dashed #000; margin:5px 0;">
                    <div style="font-size:11px; text-align:right;">
                        <div>عدد الطلبات: ${activeDriverOrders.length}</div>
                        <div>مجموع الوجبات: ${mealsTotal.toLocaleString('ar-IQ')} د.ع</div>
                        <div>أجور التوصيل: ${deliveryFees.toLocaleString('ar-IQ')} د.ع</div>
                        <div style="font-weight:bold; font-size:13px; margin-top:4px;">الصافي المطلوب: ${(mealsTotal + deliveryFees).toLocaleString('ar-IQ')} د.ع</div>
                    </div>
                </div>
            `;
            window.print();
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function prepareAndOpenPrintModal() {
            if (posCart.length === 0) return alert("⚠️ السلة فارغة!");
            openModal('printOptionsModal');
        }

        function executeCustomerPrintOnly() { window.print(); }
        function executeKitchenPrintOnly() { window.print(); }

        function tryFinalizeAndClearOrder() {
            clearPosCart();
            closeModal('printOptionsModal');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const passInput = document.getElementById('cashierPassInput');
            if (passInput) passInput.focus();
        });
    </script>
</body>
</html>
