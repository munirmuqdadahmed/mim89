<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقطة البيع - الكاشير</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body onload="initCashierPage()">

    <!-- نافذة تسجيل الدخول بكلمة المرور -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <h2><i class="fa-solid fa-user-lock"></i> تسجيل دخول الكاشير</h2>
            <p>يرجى اختيار الكاشير وإدخال كلمة المرور للوصول</p>
            <div class="form-group">
                <label>اختر الكاشير:</label>
                <select id="cashierSelect" class="form-control"></select>
            </div>
            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="cashierPassInput" class="form-control" placeholder="أدخل كلمة المرور">
            </div>
            <button onclick="loginCashier()" class="btn btn-primary">دخول</button>
            <p id="authError" class="error-msg"></p>
        </div>
    </div>

    <!-- واجهة الكاشير الرئيسية -->
    <div id="cashierMainApp" class="cashier-layout" style="display: none;">
        <!-- الجانب الأيمن: قائمة الأصناف -->
        <div class="cashier-products">
            <header class="pos-header">
                <div class="user-info">
                    <span id="activeCashierName"></span>
                    <button onclick="logoutCashier()" class="btn-sm btn-danger"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
                </div>
                <div class="pos-search">
                    <input type="text" id="cashierSearch" oninput="filterCashierItems()" placeholder="بحث عن صنف...">
                </div>
            </header>

            <div class="categories-tab-bar" id="cashierCatNav"></div>
            <div class="products-grid" id="cashierProductsGrid"></div>
        </div>

        <!-- الجانب الأيسر: سلة الفاتورة -->
        <div class="cashier-cart">
            <h3><i class="fa-solid fa-receipt"></i> الفاتورة الحالية</h3>
            <div class="cart-items-list" id="cartItemsList">
                <p class="empty-cart-msg">السلة فارغة حالياً</p>
            </div>
            
            <div class="cart-summary">
                <div class="summary-row">
                    <span>المجموع الكلي:</span>
                    <span id="cartTotal" class="total-price">0 د.ع</span>
                </div>
                <div class="cart-actions">
                    <button onclick="clearCart()" class="btn btn-danger"><i class="fa-solid fa-trash"></i> إغلاق الفاتورة</button>
                    <button onclick="processCheckout()" class="btn btn-success"><i class="fa-solid fa-print"></i> دفع وطباعة</button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة الطباعة -->
    <div id="receiptModal" class="modal">
        <div class="modal-content print-area">
            <div class="receipt-header">
                <h2>فاتورة مبيعات</h2>
                <p id="receiptDate"></p>
                <p id="receiptCashier"></p>
            </div>
            <hr>
            <div id="receiptBody"></div>
            <hr>
            <div class="receipt-footer">
                <p>إجمالي الفاتورة: <strong id="receiptTotal"></strong></p>
                <p>شكراً لزيارتكم!</p>
            </div>
            <div class="no-print" style="margin-top: 15px; text-align: center;">
                <button onclick="window.print()" class="btn btn-primary"><i class="fa-solid fa-print"></i> طباعة</button>
                <button onclick="closeModal('receiptModal')" class="btn btn-secondary">إغلاق</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
