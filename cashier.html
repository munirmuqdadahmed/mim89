<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM89 - شاشة الكاشير والمطبخ (الطلبات المتعددة)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #111; color: #fff; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 15px 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; }
        h2 { color: #ff9f00; font-size: 20px; }
        
        .orders-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .order-card { background: #1a1a1a; border: 2px solid #ff9f00; border-radius: 12px; padding: 15px; position: relative; animation: pulseBorder 1.5s infinite; }
        @keyframes pulseBorder { 0% { border-color: #ff9f00; } 50% { border-color: #25d366; } 100% { border-color: #ff9f00; } }
        
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px; font-size: 14px; }
        .order-body { font-size: 13px; color: #ddd; margin-bottom: 15px; }
        .order-items-list { background: #222; padding: 8px; border-radius: 6px; margin-top: 8px; max-height: 120px; overflow-y: auto; }
        .order-items-list div { display: flex; justify-content: space-between; margin-bottom: 4px; border-bottom: 1px solid #2a2a2a; padding-bottom: 3px; }
        
        .btn-group { display: flex; gap: 8px; }
        .btn-print { background: #ff9f00; color: #000; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-done { background: #e63946; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
        
        .no-orders { text-align: center; color: #777; grid-column: 1 / -1; margin-top: 50px; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <h2>💻 شاشة الطلبات الواردة (تستوعب عدة حجوزات بالتزامن)</h2>
        <div id="statusIndicator" style="color: #25d366; font-size: 13px; font-weight: bold;"><i class="fas fa-circle" style="font-size:10px;"></i> المتجر متصل ويستقبل الطلبات</div>
    </header>

    <div id="incomingOrdersContainer" class="orders-container">
        <div class="no-orders">لا توجد طلبات جديدة حالياً...</div>
    </div>

<script>
    // صوت تنبيه إلكتروني عند وصول طلب جديد
    function playAlertSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
        } catch(e) {
            console.log("Audio not supported");
        }
    }

    // تتبع الطلبات النشطة المعروضة منعاً للتكرار
    let activeOrdersMap = new Map();

    function checkNewOrders() {
        const rawOrders = localStorage.getItem('mim89_pending_orders');
        if (!rawOrders) return;

        try {
            const ordersList = JSON.parse(rawOrders);
            if (Array.isArray(ordersList) && ordersList.length > 0) {
                let hasNew = false;
                ordersList.forEach(order => {
                    if (order && order.id && !activeOrdersMap.has(order.id)) {
                        activeOrdersMap.set(order.id, order);
                        renderIncomingOrder(order);
                        hasNew = true;
                    }
                });
                if (hasNew) {
                    playAlertSound();
                }
            }
        } catch(e) {
            console.error("Error parsing orders list");
        }
    }

    function renderIncomingOrder(order) {
        const container = document.getElementById('incomingOrdersContainer');
        if (container.querySelector('.no-orders')) {
            container.innerHTML = '';
        }

        let itemsHtml = '';
        if (order.items && Array.isArray(order.items)) {
            order.items.forEach(i => {
                itemsHtml += `<div><span>${i.name} (×${i.qty || 1})</span> <span>${i.price}</span></div>`;
            });
        }

        const card = document.createElement('div');
        card.className = 'order-card';
        card.id = `order-${order.id}`;
        card.innerHTML = `
            <div class="order-header">
                <span style="color:#ff9f00; font-weight:bold;">👤 ${order.customerName}</span>
                <span style="color:#aaa;">⏰ ${order.time}</span>
            </div>
            <div class="order-body">
                <div><b>📞 الهاتف:</b> ${order.phone}</div>
                <div><b>📍 العنوان:</b> ${order.address}</div>
                <div><b>🛵 النوع:</b> ${order.type}</div>
                ${order.notes ? `<div><b>📝 ملاحظات:</b> ${order.notes}</div>` : ''}
                <div class="order-items-list">
                    ${itemsHtml}
                </div>
                <div style="margin-top:8px; font-weight:bold; color:#ff9f00; text-align:left;">الإجمالي: ${order.total || 'حسب الطلب'}</div>
            </div>
            <div class="btn-group">
                <button class="btn-print" onclick="printOrder(${order.id})"><i class="fas fa-print"></i> طباعة</button>
                <button class="btn-done" onclick="completeOrder(${order.id})"><i class="fas fa-check"></i> إنجاز</button>
            </div>
        `;
        
        container.prepend(card);
    }

    function printOrder(orderId) {
        window.print();
    }

    function completeOrder(orderId) {
        const card = document.getElementById(`order-${orderId}`);
        if (card) {
            card.style.opacity = '0.3';
            setTimeout(() => card.remove(), 400);
        }
        
        // إزالة الطلب المنجز من قائمة الانتظار في الذاكرة المشتركة
        activeOrdersMap.delete(orderId);
        try {
            const rawOrders = localStorage.getItem('mim89_pending_orders');
            if (rawOrders) {
                let ordersList = JSON.parse(rawOrders);
                ordersList = ordersList.filter(o => o.id !== orderId);
                localStorage.setItem('mim89_pending_orders', JSON.stringify(ordersList));
            }
        } catch(e) {
            console.error("Error updating storage");
        }

        // إرجاع رسالة "لا توجد طلبات" إذا فرغت القائمة
        setTimeout(() => {
            const container = document.getElementById('incomingOrdersContainer');
            if (container && container.children.length === 0) {
                container.innerHTML = '<div class="no-orders">لا توجد طلبات جديدة حالياً...</div>';
            }
        }, 500);
    }

    // الفحص المستمر كل ثانية لاستقبال الطلبات المتعددة بالتزامن
    setInterval(checkNewOrders, 1000);

    window.onload = () => {
        checkNewOrders();
    };
</script>
</body>
</html>
