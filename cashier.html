<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM89 - نقطة البيع (الكاشير السحابي)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #111; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #1a1a1a; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo-area { color: #ff9f00; font-size: 16px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
        
        .cashier-container { display: flex; flex: 1; overflow: hidden; }
        .items-section { flex: 2; padding: 15px; overflow-y: auto; background: #151515; }
        .invoice-section { flex: 1; background: #1a1a1a; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 15px; min-width: 360px; overflow-y: auto; }
        .invoice-title { font-size: 15px; color: #ff9f00; margin-bottom: 10px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        .pos-btn { width: 100%; padding: 11px; background: #25d366; color: #fff; border: none; border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; margin-top: 6px; text-align: center; }
        .pos-btn.print { background: #ff9f00; color: #000; }

        /* صندوق الطلبات الإلكترونية السحابية المتعددة */
        .online-orders-box { border-top: 2px dashed #444; padding-top: 12px; margin-top: 10px; }
        .online-title { font-size: 13px; color: #ff9f00; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .online-badge { background: #e63946; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 10px; }
        .online-list-container { max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .online-order-card { background: #222; border: 1px solid #ff9f00; border-radius: 8px; padding: 10px; font-size: 12px; animation: pulseBorder 1.5s infinite; }
        @keyframes pulseBorder { 0% { border-color: #ff9f00; } 50% { border-color: #25d366; } 100% { border-color: #ff9f00; } }
        
        .online-order-header { display: flex; justify-content: space-between; color: #ff9f00; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 4px; margin-bottom: 6px; }
        .online-items-mini { background: #181818; padding: 4px 8px; border-radius: 4px; margin: 6px 0; color: #ccc; max-height: 70px; overflow-y: auto; }
        .online-items-mini div { display: flex; justify-content: space-between; border-bottom: 1px solid #252525; padding: 2px 0; }
        .online-btns { display: flex; gap: 5px; margin-top: 6px; }
        .online-btns button { flex: 1; padding: 5px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }

        .custom-modal { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; border: 1px solid #444; border-radius: 12px; width: 90%; max-width: 380px; padding: 20px; color: #fff; text-align: center; }
        .modal-content input { width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 6px; margin: 15px 0; font-size: 18px; text-align: center; outline: none; }
    </style>
</head>
<body>

    <div id="pinModal" class="custom-modal">
        <div class="modal-content">
            <h3 style="color:#ff9f00; margin-bottom:5px;">🔐 دخول شاشة الكاشير</h3>
            <p style="font-size:12px; color:#aaa;">أدخل رمز الكاشير (مثال: 1111 أو 2222)</p>
            <input type="password" id="cashierPinInput" placeholder="****" autofocus>
            <button class="pos-btn print" onclick="verifyCashierPin()">دخول للنظام</button>
        </div>
    </div>

    <header>
        <div class="logo-area"><span>MIM89 FAST FOOD - شاشة الكاشير السحابي</span></div>
        <div id="statusIndicator" style="color: #25d366; font-size: 13px; font-weight: bold;"><i class="fas fa-circle" style="font-size:10px;"></i> المتصل بالسحاب</div>
    </header>

    <div class="cashier-container">
        <div class="items-section">
            <h3 style="color:#777;">لوحة التحكم والعمليات المباشرة للكاشير...</h3>
        </div>

        <div class="invoice-section">
            <div class="invoice-title">
                <span><i class="fas fa-receipt"></i> الفاتورة الحالية</span>
            </div>

            <!-- صندوق الحجوزات والطلبات الإلكترونية السحابية (تستوعب عدة طلبات متزامنة) -->
            <div class="online-orders-box">
                <div class="online-title">
                    <span><i class="fas fa-cloud"></i> الحجوزات والطلبات الإلكترونية (عبر الإنترنت)</span>
                    <span id="onlineCountBadge" class="online-badge">0</span>
                </div>
                <div id="onlineOrdersContainer" class="online-list-container">
                    <div style="color:#666; text-align:center; font-size:11px; padding:15px;">جاري مراقبة الطلبات السحابية...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAGpEDu0Sm2zG0AcG31XnudmC7wLsipqvI",
          authDomain: "mim89-ff938.firebaseapp.com",
          projectId: "mim89-ff938",
          storageBucket: "mim89-ff938.firebasestorage.app",
          messagingSenderId: "8207632733",
          appId: "1:8207632733:web:49cd53fe5dbf26216b80b4",
          measurementId: "G-D9GK0G77ZD"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function verifyCashierPin() {
            const pin = document.getElementById('cashierPinInput').value.trim();
            if (pin === "1111" || pin === "2222" || pin === "8989") {
                document.getElementById('pinModal').style.display = 'none';
                listenToCloudOrders(); // بدء الاستماع الفوري للطلبات السحابية بعد الدخول
            } else {
                alert("❌ الرمز السري غير صحيح!");
            }
        }

        function playAlertSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch(e) {}
        }

        let loadedOrdersIds = new Set();
        let isFirstLoad = true;

        // الاستماع الفوري واللحظي (Real-time Listener) للطلبات السحابية
        function listenToCloudOrders() {
            db.collection("mim89_orders").orderBy("timestamp", "desc")
            .onSnapshot((snapshot) => {
                let activeCount = 0;
                const container = document.getElementById('onlineOrdersContainer');
                
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const ord = { docId: change.doc.id, ...change.doc.data() };
                        if (!loadedOrdersIds.has(ord.docId)) {
                            loadedOrdersIds.add(ord.docId);
                            renderOnlineOrderCard(ord);
                            if (!isFirstLoad) {
                                playAlertSound(); // تنبيه صوتي فوري عند وصول طلب جديد عبر النت
                            }
                        }
                    }
                });

                isFirstLoad = false;
                document.getElementById('onlineCountBadge').innerText = snapshot.size;
                if (snapshot.size === 0) {
                    container.innerHTML = '<div style="color:#666; text-align:center; font-size:11px; padding:15px;">لا توجد طلبات إلكترونية جديدة</div>';
                }
            });
        }

        function renderOnlineOrderCard(ord) {
            const container = document.getElementById('onlineOrdersContainer');
            if (container.querySelector('div') && container.querySelector('div').innerText.includes("جاري مراقبة") || container.querySelector('div').innerText.includes("لا توجد")) {
                container.innerHTML = '';
            }

            let itemsHtml = '';
            if (ord.items && Array.isArray(ord.items)) {
                ord.items.forEach(i => {
                    itemsHtml += `<div><span>${i.name} (x${i.qty || 1})</span><span>${i.price}</span></div>`;
                });
            }

            const card = document.createElement('div');
            card.className = 'online-order-card';
            card.id = `cloud-card-${ord.docId}`;
            card.innerHTML = `
                <div class="online-order-header">
                    <span>👤 ${ord.customerName} (${ord.type})</span>
                    <span>⏰ ${ord.time}</span>
                </div>
                <div style="font-size:11px; color:#ddd;">
                    <div><b>📞 الهاتف:</b> ${ord.phone}</div>
                    <div><b>📍 العنوان:</b> ${ord.address}</div>
                    ${ord.notes ? `<div><b>📝 ملاحظات:</b> ${ord.notes}</div>` : ''}
                </div>
                <div class="online-items-mini">${itemsHtml}</div>
                <div style="font-weight:bold; color:#ff9f00; text-align:left; font-size:11px; margin-top:2px;">الإجمالي: ${ord.total || 'حسب الطلب'}</div>
                <div class="online-btns">
                    <button style="background:#ff9f00; color:#000;" onclick="window.print()"><i class="fas fa-print"></i> طباعة</button>
                    <button style="background:#25d366; color:#fff;" onclick="approveCloudOrder('${ord.docId}')"><i class="fas fa-check"></i> إنجاز وإزالة</button>
                </div>
            `;
            container.prepend(card);
        }

        function approveCloudOrder(docId) {
            db.collection("mim89_orders").doc(docId).delete()
            .then(() => {
                const card = document.getElementById(`cloud-card-${docId}`);
                if (card) card.remove();
                loadedOrdersIds.delete(docId);
                
                const container = document.getElementById('onlineOrdersContainer');
                if (container.children.length === 0) {
                    container.innerHTML = '<div style="color:#666; text-align:center; font-size:11px; padding:15px;">لا توجد طلبات إلكترونية جديدة</div>';
                }
            })
            .catch((error) => {
                alert("تعذر حذف الطلب، تأكد من الاتصال.");
            });
        }
    </script>
</body>
</html>
