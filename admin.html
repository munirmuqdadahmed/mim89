<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM89 - لوحة الإدارة الشاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #111; color: #fff; padding: 15px; max-width: 650px; margin: 0 auto; padding-bottom: 120px; }
        h1 { text-align: center; color: #ff9f00; margin: 15px 0 20px; font-size: 22px; font-weight: 900; }
        .login-box, .pass-box { background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; margin-bottom: 20px; }
        .login-box { text-align: center; margin-top: 50px; }
        input, textarea { width: 100%; padding: 10px; margin: 6px 0 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; text-align: right; }
        button { width: 100%; padding: 12px; background: #ff9f00; color: #000; border: none; border-radius: 10px; font-weight: 900; font-size: 15px; cursor: pointer; margin-top: 5px; }
        .editor-section { display: none; }
        .item-card { background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .item-card label { display: block; font-size: 12px; color: #ff9f00; margin-top: 4px; font-weight: bold; }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px; }
        .btn-delete { background: #e63946; color: #fff; width: auto; padding: 4px 10px; font-size: 12px; border-radius: 6px; }
        .btn-add { background: #222; border: 2px dashed #ff9f00; color: #ff9f00; margin-bottom: 20px; }
        .preview-img { width: 100%; height: 160px; object-fit: cover; object-position: center; border-radius: 8px; margin-top: 8px; border: 1px solid #ff9f00; }
        .sticky-save { position: fixed; bottom: 15px; left: 15px; right: 15px; max-width: 620px; margin: 0 auto; box-shadow: 0 5px 25px rgba(255,159,0,0.4); z-index: 1000; }
    </style>
</head>
<body>

    <h1>إدارة مينيو MIM89 FAST FOOD 🍔</h1>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-section" class="login-box">
        <h3 style="margin-bottom:15px; color:#ff9f00;">رمز دخول الإدارة</h3>
        <input type="password" id="pass-input" placeholder="أدخل كلمة المرور">
        <button onclick="checkPass()">دخول اللوحة</button>
    </div>

    <!-- لوحة التحكم وتعديل الأصناف -->
    <div id="editor-section" class="editor-section">
        
        <!-- قسم تغيير كلمة المرور داخل الصفحة -->
        <div class="pass-box">
            <h4 style="color:#ff9f00; margin-bottom:8px; font-size:15px;">🔒 تغيير رمز المرور الخاص باللوحة</h4>
            <label style="font-size:12px; color:#aaa;">كلمة المرور الجديدة:</label>
            <input type="text" id="new-pass-input" placeholder="أدخل الرمز الجديد هنا">
            <button onclick="updatePassword()" style="background:#25d366; color:#fff;">حفظ كلمة المرور الجديدة</button>
        </div>

        <button class="btn-add" onclick="addNewItem()">➕ إضافة صنف جديد للمينيو</button>
        <div id="items-container"></div>
        <button class="sticky-save" onclick="saveAllChanges()">💾 حفظ وتحديث المينيو فوراً</button>
    </div>

<script>
    let currentPass = localStorage.getItem('mim89_admin_pass') || "MIM123";

    const defaultItems = [
        { id: 1, cat: "🔥 العروض الخاصة واليومية", name: "🔥 عرض الفردي المميز", desc: "بركر 89 الخاص + فنكر كلاسيك + بيبسي مبرد", price: "5,500 د.ع", img: "https://foodish-api.com/images/burger/burger2.jpg" },
        { id: 2, cat: "🍔 قسم البركر", name: "بركر كلاسيك (لحم)", desc: "لحم طازج مع الصوص الخاص والخضار مع فنكر", price: "4,000 د.ع", img: "https://foodish-api.com/images/burger/burger1.jpg" },
        { id: 3, cat: "🌯 قسم الشاورما", name: "شاورما صاج دجاج (عادي)", desc: "خبز صاج، شاورما دجاج، ثوم، وبطاطا", price: "2,500 د.ع", img: "https://foodish-api.com/images/samosa/samosa2.jpg" },
        { id: 4, cat: "🍚 قسم الريزو", name: "ريزو كلاسيك", desc: "أرز الريزو المميز مع قطع الدجاج المقرمشة وصوص الريزو", price: "5,000 د.ع", img: "https://foodish-api.com/images/rice/rice1.jpg" }
    ];

    let currentItems = [];

    function checkPass() {
        const enteredPass = document.getElementById('pass-input').value;
        if (enteredPass === currentPass) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('editor-section').style.display = 'block';
            document.getElementById('new-pass-input').value = currentPass;
            loadAdminData();
        } else {
            alert("كلمة المرور غير صحيحة!");
        }
    }

    function updatePassword() {
        const newPass = document.getElementById('new-pass-input').value.trim();
        if (newPass.length < 3) {
            alert("⚠️ يجب أن تكون كلمة المرور 3 أحرف أو أرقام على الأقل!");
            return;
        }
        currentPass = newPass;
        localStorage.setItem('mim89_admin_pass', currentPass);
        alert("✅ تم تغيير وتحديث كلمة المرور بنجاح!");
    }

    function loadAdminData() {
        const saved = localStorage.getItem('mim89_full_menu_data');
        currentItems = saved ? JSON.parse(saved) : defaultItems;
        renderAdminCards();
    }

    function renderAdminCards() {
        const container = document.getElementById('items-container');
        container.innerHTML = '';

        currentItems.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div class="card-header">
                    <span style="font-weight:bold; color:#ff9f00;">صنف #${index + 1}</span>
                    <button class="btn-delete" onclick="deleteItem(${index})">🗑️ حذف الصنف</button>
                </div>

                <label>اسم القسم:</label>
                <input type="text" value="${item.cat}" id="cat-${index}">

                <label>اسم الوجبة:</label>
                <input type="text" value="${item.name}" id="name-${index}">

                <label>الوصف والمكونات:</label>
                <textarea id="desc-${index}">${item.desc}</textarea>

                <label>السعر:</label>
                <input type="text" value="${item.price}" id="price-${index}">

                <label>رابط صورة الوجبة (ضع رابط الصورة هنا مباشرة):</label>
                <input type="text" value="${item.img}" id="img-${index}" oninput="updatePreview(${index})">
                <img src="${item.img}" id="preview-${index}" class="preview-img">
            `;
            container.appendChild(card);
        });
    }

    function updatePreview(index) {
        const url = document.getElementById(`img-${index}`).value;
        const preview = document.getElementById(`preview-${index}`);
        if(preview) preview.src = url;
    }

    function addNewItem() {
        currentItems.unshift({
            id: Date.now(),
            cat: "🍔 قسم البركر",
            name: "وجبة جديدة",
            desc: "الوصف والمكونات...",
            price: "5,000 د.ع",
            img: "https://via.placeholder.com/300x180/222/ff9f00?text=MIM89+FAST+FOOD"
        });
        renderAdminCards();
        window.scrollTo({ top: 100, behavior: 'smooth' });
    }

    function deleteItem(index) {
        if (confirm("هل أنت متأكد من حذف هذا الصنف؟")) {
            currentItems.splice(index, 1);
            renderAdminCards();
        }
    }

    function saveAllChanges() {
        currentItems.forEach((item, index) => {
            const catEl = document.getElementById(`cat-${index}`);
            const nameEl = document.getElementById(`name-${index}`);
            const descEl = document.getElementById(`desc-${index}`);
            const priceEl = document.getElementById(`price-${index}`);
            const imgEl = document.getElementById(`img-${index}`);

            if (catEl) item.cat = catEl.value;
            if (nameEl) item.name = nameEl.value;
            if (descEl) item.desc = descEl.value;
            if (priceEl) item.price = priceEl.value;
            if (imgEl) item.img = imgEl.value;
        });

        localStorage.setItem('mim89_full_menu_data', JSON.stringify(currentItems));
        alert("🎉 تم حفظ وتحديث المينيو بجميع الصور والأصناف بنجاح!");
    }
</script>

</body>
</html>
