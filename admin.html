<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM89 - لوحة الإدارة المركزية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #111; color: #fff; padding: 20px; }
        h2 { color: #ff9f00; text-align: center; margin-bottom: 20px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        input, select { width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-family: 'Cairo'; }
        button { background: #ff9f00; color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; }
        .back-link { display: block; text-align: center; color: #ff9f00; text-decoration: none; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>⚙️ لوحة الإدارة المركزية - MIM89</h2>

    <div class="card">
        <h3 style="color:#ff9f00; font-size:14px; margin-bottom:10px;">🔐 إدارة أسماء الكاشير والرموز السرية</h3>
        <label style="font-size:11px; color:#aaa;">اسم الكاشير الأول:</label><input type="text" id="c1Name">
        <label style="font-size:11px; color:#aaa;">رمز الكاشير الأول:</label><input type="text" id="c1Pin">
        <label style="font-size:11px; color:#aaa;">اسم الكاشير الثاني:</label><input type="text" id="c2Name">
        <label style="font-size:11px; color:#aaa;">رمز الكاشير الثاني:</label><input type="text" id="c2Pin">
        <label style="font-size:11px; color:#aaa;">رمز المخزن:</label><input type="text" id="invPin">
        <label style="font-size:11px; color:#aaa;">رمز الإدارة:</label><input type="text" id="admPin">
        <button onclick="saveSettings()">حفظ الإعدادات</button>
    </div>

    <div class="card">
        <h3 style="color:#ff9f00; font-size:14px; margin-bottom:10px;">🍔 إضافة وجبة جديدة للمينيو</h3>
        <input type="text" id="mCat" placeholder="القسم (مثلاً: 🌯 قسم الشاورما)">
        <input type="text" id="mName" placeholder="اسم الوجبة">
        <input type="text" id="mPrice" placeholder="السعر (مثلاً: 3,000 د.ع)">
        <input type="text" id="mImg" placeholder="رابط الصورة">
        <button onclick="addNewMeal()">إضافة الوجبة</button>
    </div>

    <a href="cashier.html" class="back-link">⬅ الانتقال إلى شاشة الكاشير</a>

<script>
    function loadSettings() {
        const settings = JSON.parse(localStorage.getItem('mim89_settings')) || { c1Name: "الكاشير الأول", c1Pin: "1111", c2Name: "الكاشير الثاني", c2Pin: "2222", invPin: "3333", admPin: "9999" };
        document.getElementById('c1Name').value = settings.c1Name;
        document.getElementById('c1Pin').value = settings.c1Pin;
        document.getElementById('c2Name').value = settings.c2Name;
        document.getElementById('c2Pin').value = settings.c2Pin;
        document.getElementById('invPin').value = settings.invPin;
        document.getElementById('admPin').value = settings.admPin;
    }

    function saveSettings() {
        const newSettings = {
            c1Name: document.getElementById('c1Name').value,
            c1Pin: document.getElementById('c1Pin').value,
            c2Name: document.getElementById('c2Name').value,
            c2Pin: document.getElementById('c2Pin').value,
            invPin: document.getElementById('invPin').value,
            admPin: document.getElementById('admPin').value
        };
        localStorage.setItem('mim89_settings', JSON.stringify(newSettings));
        alert("✅ تم حفظ إعدادات النظام بنجاح!");
    }

    function addNewMeal() {
        let cat = document.getElementById('mCat').value.trim();
        let name = document.getElementById('mName').value.trim();
        let price = document.getElementById('mPrice').value.trim();
        let img = document.getElementById('mImg').value.trim() || "https://foodish-api.com/images/burger/burger1.jpg";

        if(!cat || !name || !price) return alert("يرجى تعبئة الحقول الأساسية!");
        let menu = JSON.parse(localStorage.getItem('mim89_custom_menu')) || [];
        menu.push({ id: Date.now(), cat, name, price, img });
        localStorage.setItem('mim89_custom_menu', JSON.stringify(menu));
        alert("✅ تمت إضافة الوجبة بنجاح!");
        document.getElementById('mName').value = '';
        document.getElementById('mPrice').value = '';
    }

    window.onload = loadSettings;
</script>
</body>
</html>
