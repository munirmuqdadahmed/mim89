<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM89 - لوحة الإدارة الشاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #111; color: #fff; padding: 15px; max-width: 650px; margin: 0 auto; padding-bottom: 100px; }
        h1 { text-align: center; color: #ff9f00; margin: 15px 0 20px; font-size: 22px; font-weight: 900; }
        .login-box { background: #1a1a1a; padding: 25px; border-radius: 15px; border: 1px solid #333; text-align: center; margin-top: 50px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 14px; text-align: right; }
        input[type="file"] { background: transparent; border: none; padding: 0; }
        button { width: 100%; padding: 12px; background: #ff9f00; color: #000; border: none; border-radius: 10px; font-weight: 900; font-size: 15px; cursor: pointer; margin-top: 5px; }
        .editor-section { display: none; }
        .item-card { background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 12px; margin-bottom: 15px; position: relative; }
        .item-card label { display: block; font-size: 12px; color: #ff9f00; margin-top: 4px; font-weight: bold; }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px; }
        .btn-delete { background: #e63946; color: #fff; width: auto; padding: 4px 10px; font-size: 12px; border-radius: 6px; }
        .btn-add { background: #222; border: 2px dashed #ff9f00; color: #ff9f00; margin-bottom: 25px; }
        .preview-img { width: 100px; height: 60px; object-fit: contain; background: #222; border-radius: 6px; margin-top: 5px; border: 1px solid #444; }
        .sticky-save { position: fixed; bottom: 15px; left: 15px; right: 15px; max-width: 620px; margin: 0 auto; box-shadow: 0 5px 25px rgba(255,159,0,0.4); z-index: 1000; }
    </style>
</head>
<body>

    <h1>إدارة مينيو MIM89 FAST FOOD 🍔</h1>

    <!-- تسجيل الدخول -->
    <div id="login-section" class="login-box">
        <h3 style="margin-bottom:15px; color:#ff9f00;">رمز دخول الإدارة</h3>
        <input type="password" id="pass-input" placeholder="أدخل كلمة المرور">
        <button onclick="checkPass()">دخول اللوحة</button>
    </div>

    <!-- قسم الإدارة والتعديل -->
    <div id="editor-section" class="editor-section">
        <button class="btn-add" onclick="addNewItem()">➕ إضافة صنف جديد للمينيو</button>
        
        <div id="items-container"></div>

        <button class="sticky-save" onclick="saveAllChanges()">💾 حفظ وتحديث المينيو فوراً</button>
    </div>

<script>
    const SECRET_PASS = "MIM123";

    // قائمة الأصناف الأساسية المعتمدة في مطعمك
    const defaultItems = [
        { id: 1, cat: "قسم الشاورما 🌯", name: "شاورما صاج دجاج (عادي)", desc: "ثومية، مخلل، خبز صاج، بطاطا", price: "4,000 د.ع", img: "Images/shawarma_chicken.jpg" },
        { id: 2, cat: "قسم الشاورما 🌯", name: "شاورما صاج دجاج (دبل)", desc: "ثومية مضاعفة، مخلل، صاج دبل، بطاطا", price: "6,000 د.ع", img: "Images/shawarma_chicken_double.jpg" },
        { id: 3, cat: "قسم البركر 🍔", name: "بركر لحم MIM89 (سنجل)", desc: "شريحة لحم صافي، جبنة شيدر، صوص MIM الخاص، خضار", price: "5,000 د.ع", img: "Images/burger_single.jpg" },
        { id: 4, cat: "أطباق الريزو 🍚", name: "طبق ريزو دجاج عادي", desc: "أرز ريزو مبهر، قطع دجاج كرسبي، صوص ريزو خاص", price: "5,000 د.ع", img: "Images/rizo_chicken.jpg" },
        { id: 5, cat: "الكنتاكي والوجبات المقرمشة 🍗", name: "وجبة كنتاكي (3 قطع)", desc: "3 قطع دجاج مقرمش، بطاطا، ثومية، خبز، كولسلو", price: "7,000 د.ع", img: "Images/kentucky_3.jpg" }
    ];

    let currentItems = [];

    function checkPass() {
        if (document.getElementById('pass-input').value === SECRET_PASS) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('editor-section').style.display = 'block';
            loadAdminData();
        } else {
            alert("كلمة المرور غير صحيحة!");
        }
    }

    function loadAdminData() {
        const saved = localStorage.getItem('mim89_full_menu_data');
        currentItems = saved ? JSON.parse(saved) : defaultItems;
        renderAdminCards();
    }

    function renderAdminCards() {
        const container = document.getElementById('items-container');
        container.innerHTML = '';

        currentItems.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div class="card-header">
                    <span style="font-weight:bold; color:#ff9f00;">صنف #${index + 1}</span>
                    <button class="btn-delete" onclick="deleteItem(${index})">🗑️ حذفالصنف</button>
                </div>

                <label>القسم:</label>
                <input type="text" value="${item.cat}" id="cat-${index}">

                <label>اسم الوجبة:</label>
                <input type="text" value="${item.name}" id="name-${index}">

                <label>الوصف والمكونات:</label>

                <textarea id="desc-${index}">${item.desc}</textarea>

                <label>السعر:</label>
                <input type="text" value="${item.price}" id="price-${index}">

                <label>صورة الوجبة:</label>
                <input type="file" accept="image/*" onchange="handleImage(this, ${index})">
                <img src="${item.img}" id="preview-${index}" class="preview-img">
            `;
            container.appendChild(card);
        });
    }

    function addNewItem() {
        currentItems.unshift({
            id: Date.now(),
            cat: "قسم الشاورما 🌯",
            name: "وجبة جديدة",
            desc: "الوصف والمكونات...",
            price: "5,000 د.ع",
            img: "https://via.placeholder.com/300x180/222/ff9f00?text=MIM89+FAST+FOOD"
        });
        renderAdminCards();
        window.scrollTo({ top: 100, behavior: 'smooth' });
    }

    function deleteItem(index) {
        if (confirm("هل أنت متأكد من حذف هذا الصنف من المينيو؟")) {
            currentItems.splice(index, 1);
            renderAdminCards();
        }
    }

    function handleImage(input, index) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                currentItems[index].img = e.target.result;
                document.getElementById(`preview-${index}`).src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function saveAllChanges() {
        // تجميع البيانات المحدثة
        currentItems.forEach((item, index) => {
            item.cat = document.getElementById(`cat-${index}`).value;
            item.name = document.getElementById(`name-${index}`).value;
            item.desc = document.getElementById(`desc-${index}`).value;
            item.price = document.getElementById(`price-${index}`).value;
        });

        localStorage.setItem('mim89_full_menu_data', JSON.stringify(currentItems));
        alert("تم حفظ كافة التعديلات بنجاح! تفقّد المينيو الرئيسي الآن.");
    }
</script>

</body>
</html>
