<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM89 - لوحة التحكم الخاصة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #121212; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #ff9f00; margin-bottom: 20px; font-size: 24px; }
        .login-box { background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #ff9f00; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .editor-section { display: none; }
        .item-card { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .item-card label { display: block; font-size: 12px; color: #ff9f00; margin-top: 8px; text-align: right; }
        .item-card input { text-align: right; }
    </style>
</head>
<body>

    <h1>لوحة إدارة MIM89 FAST FOOD</h1>

    <!-- نموذج تسجيل الدخول -->
    <div id="login-section" class="login-box">
        <h3>أدخل كلمة المرور للدخول</h3>
        <input type="password" id="pass-input" placeholder="كلمة المرور">
        <button onclick="checkPass()">دخول اللوحة</button>
    </div>

    <!-- لوحة التعديل -->
    <div id="editor-section" class="editor-section">
        <div id="items-list"></div>
        <button onclick="saveChanges()" style="position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 560px; margin: 0 auto; box-shadow: 0 5px 20px rgba(255,159,0,0.4);">💾 حفظ وتحديث المينيو فوراً</button>
    </div>

<script>
    const SECRET_PASS = "MIM123"; // كلمة المرور الخاصة بك

    function checkPass() {
        const pass = document.getElementById('pass-input').value;
        if (pass === SECRET_PASS) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('editor-section').style.display = 'block';
            loadAdminItems();
        } else {
            alert("كلمة المرور غير صحيحة!");
        }
    }

    function loadAdminItems() {
        const listContainer = document.getElementById('items-list');
        listContainer.innerHTML = '<p style="text-align:center; color:#aaa;">جاري تحميل الأصناف...</p>';

        // قراءة البيانات المحفوظة أو التنبيه
        const savedData = localStorage.getItem('mim89_custom_prices');
        let prices = savedData ? JSON.parse(savedData) : {};

        listContainer.innerHTML = `
            <div class="item-card">
                <h3>تعديل سريع للأسعار والأصناف</h3>
                <p style="font-size:12px; color:#888; margin-bottom:10px;">أدخل المعرف والاسم الجديد والسعر ليتم التحديث فوراً في المينيو الرئيسية.</p>
                
                <label>سعر لفة الشاورما العادي:</label>
                <input type="text" id="p_shawarma_c" value="${prices['p_shawarma_c'] || '4,000 د.ع'}">

                <label>سعر لفة الشاورما الدبل:</label>
                <input type="text" id="p_shawarma_cd" value="${prices['p_shawarma_cd'] || '6,000 د.ع'}">

                <label>سعر بركر MIM89 (سنجل):</label>
                <input type="text" id="p_burger_s" value="${prices['p_burger_s'] || '5,000 د.ع'}">

                <label>سعر طبق الريزو:</label>
                <input type="text" id="p_rizo" value="${prices['p_rizo'] || '5,000 د.ع'}">

                <label>سعر وجبة الكنتاكي (3 قطع):</label>

                <input type="text" id="p_kfc_3" value="${prices['p_kfc_3'] || '7,000 د.ع'}">
            </div>
        `;
    }

    function saveChanges() {
        const newPrices = {
            'p_shawarma_c': document.getElementById('p_shawarma_c').value,
            'p_shawarma_cd': document.getElementById('p_shawarma_cd').value,
            'p_burger_s': document.getElementById('p_burger_s').value,
            'p_rizo': document.getElementById('p_rizo').value,
            'p_kfc_3': document.getElementById('p_kfc_3').value
        };

        localStorage.setItem('mim89_custom_prices', JSON.stringify(newPrices));
        alert("تم حفظ التعديلات بنجاح! ستظهر للزبائن بالسعر الجديد فوراً.");
    }
</script>

</body>
</html>
