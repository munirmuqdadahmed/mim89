        { id: 805, cat: "🥤 قسم المشروبات", name: "ماء معدني", desc: "قنينة ماء نقي مبرد", price: "250 د.ع", img: "https://images.unsplash.com/photo-1548839140-29a749e1bc4e?auto=format&fit=crop&w=600&q=80" }
    ];

    let currentItems = [];

    function checkPass() {
        const enteredPass = document.getElementById('pass-input').value;
        if (enteredPass === currentPass) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('editor-section').style.display = 'block';
            document.getElementById('new-pass-input').value = currentPass;
            loadAdminData();
        } else {
            alert("كلمة المرور غير صحيحة!");
        }
    }

    function updatePassword() {
        const newPass = document.getElementById('new-pass-input').value.trim();
        if (newPass.length < 3) {
            alert("⚠️ يجب أن تكون كلمة المرور 3 أحرف أو أرقام على الأقل!");
            return;
        }
        currentPass = newPass;
        localStorage.setItem('mim89_admin_pass', currentPass);
        alert("✅ تم تغيير وتحديث كلمة المرور بنجاح!");
    }

    function loadAdminData() {
        const saved = localStorage.getItem('mim89_full_menu_data');
        currentItems = saved ? JSON.parse(saved) : defaultItems;
        renderAdminCards();
    }

    function renderAdminCards() {
        const container = document.getElementById('items-container');
        container.innerHTML = '';

        currentItems.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.setAttribute('data-cat-name', item.cat);
            card.innerHTML = `
                <div class="card-header">
                    <span style="font-weight:bold; color:#ff9f00;">صنف #${index + 1} (${item.cat})</span>
                    <button class="btn-delete" onclick="deleteItem(${index})">🗑️ حذف الصنف</button>
                </div>

                <label>اسم القسم:</label>
                <input type="text" value="${item.cat}" id="cat-${index}">

                <label>اسم الوجبة:</label>
                <input type="text" value="${item.name}" id="name-${index}">

                <label>الوصف والمكونات:</label>
                <textarea id="desc-${index}">${item.desc}</textarea>

                <label>السعر:</label>
                <input type="text" value="${item.price}" id="price-${index}">

                <label>صورة الوجبة (اختر صورة جديدة من الاستوديو):</label>
                <input type="file" accept="image/*" id="file-${index}" onchange="handleImage(event, ${index})">
                <img src="${item.img}" id="preview-${index}" class="preview-img" onerror="this.src='https://via.placeholder.com/300x180/222/ff9f00?text=MIM89+FAST+FOOD';">
            `;
            container.appendChild(card);
        });
    }

    // دالة الانتقال السريع للقسم عند الضغط على أزرار الأقسام في الأعلى
    function scrollToCat(catKeyword) {
        const cards = document.querySelectorAll('.item-card');
        for (let card of cards) {
            const catText = card.getAttribute('data-cat-name') || "";
            if (catText.includes(catKeyword)) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.style.border = '2px solid #ff9f00';
                setTimeout(() => { card.style.border = '1px solid #333'; }, 2000);
                break;
            }
        }
    }

    // دالة معالجة الصور المحلية من الموبايل
    function handleImage(event, index) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.src = e.target.result;

                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    const maxWidth = 500;
                    const maxHeight = 300;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    currentItems[index].img = compressedBase64;
                    document.getElementById(`preview-${index}`).src = compressedBase64;
                };
            };
            reader.readAsDataURL(file);
        }
    }

    function addNewItem() {
        currentItems.unshift({
            id: Date.now(),
            cat: "🍔 قسم البركر",
            name: "وجبة جديدة",
            desc: "الوصف والمكونات...",
            price: "5,000 د.ع",
            img: "https://via.placeholder.com/300x180/222/ff9f00?text=MIM89+FAST+FOOD"
        });
        renderAdminCards();
        window.scrollTo({ top: 100, behavior: 'smooth' });
    }

    function deleteItem(index) {
        if (confirm("هل أنت متأكد من حذف هذا الصنف؟")) {
            currentItems.splice(index, 1);
            renderAdminCards();
        }
    }

    function saveAllChanges() {
        currentItems.forEach((item, index) => {
            const catEl = document.getElementById(`cat-${index}`);
            const nameEl = document.getElementById(`name-${index}`);
            const descEl = document.getElementById(`desc-${index}`);
            const priceEl = document.getElementById(`price-${index}`);

            if (catEl) item.cat = catEl.value;
            if (nameEl) item.name = nameEl.value;
            if (descEl) item.desc = descEl.value;
            if (priceEl) item.price = priceEl.value;
            if (!item.id) item.id = Date.now() + index;
        });

        localStorage.setItem('mim89_full_menu_data', JSON.stringify(currentItems));
        alert("🎉 تم حفظ وتحديث المينيو بجميع الأصناف والصور والأسعار بنجاح!");
    }
</script>
