<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIM89 FAST FOOD - الإدارة المركزية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body onload="initAdminPage()">

    <!-- نافذة دخول المدير -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <div class="brand-badge">MIM89</div>
            <h2 style="color:#d4af37; margin:10px 0;"><i class="fa-solid fa-user-shield"></i> لوحة تحكم المدير العام</h2>
            <div class="form-group">
                <label>رمز المدير الرئيسي:</label>
                <input type="password" id="adminPassInput" class="gold-input" placeholder="أدخل كلمة مرور الإدارة">
            </div>
            <button onclick="loginAdmin()" class="gold-btn btn-block">دخول لوحة التحكم</button>
            <p id="authError" class="error-msg"></p>
        </div>
    </div>

    <div id="adminMainApp" class="container" style="display:none; padding:20px;">
        <header class="admin-header">
            <h1 style="color:#d4af37;"><i class="fa-solid fa-sliders"></i> لوحة الإدارة العامة والتحكم - MIM89</h1>
            <button onclick="location.reload()" class="gold-btn" style="background:#e63946; color:#fff;">خروج</button>
        </header>

        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchAdminTab('itemsTab', this)">الأصناف والمينيو</button>
            <button class="tab-btn" onclick="switchAdminTab('areasTab', this)">مناطق أجور التوصيل</button>
            <button class="tab-btn" onclick="switchAdminTab('cashiersTab', this)">الكاشيرية وإضافتهم</button>
            <button class="tab-btn" onclick="switchAdminTab('securityTab', this)">تغيير الرموز السرية</button>
        </div>

        <!-- تبويب إدارة مناطق التوصيل والأسعار -->
        <div id="areasTab" class="tab-content">
            <div class="card">
                <h3 style="color:#d4af37;">إضافة / تعديل أجور توصيل المناطق</h3>
                <div class="form-row" style="margin-top:10px;">
                    <input type="text" id="areaNameInput" class="gold-input" placeholder="اسم المنطقة (مثال: البنوك)">
                    <input type="number" id="areaPriceInput" class="gold-input" placeholder="سعر التوصيل (ضع 0 ليكون مجاني)">
                    <button onclick="saveDeliveryArea()" class="gold-btn">حفظ المنطقة</button>
                </div>
            </div>
            <div class="card" style="margin-top:20px;">
                <h3>جدول أجور التوصيل الحالية</h3>
                <table class="data-table">
                    <thead>
                        <tr><th>#</th><th>المنطقة</th><th>كلفة التوصيل</th><th>التحكم</th></tr>
                    </thead>
                    <tbody id="adminAreasTable"></tbody>
                </table>
            </div>
        </div>

        <!-- باقي التبويبات تتم الإدارة منها بنفس الآلية -->
        <div id="itemsTab" class="tab-content active">
            <div class="card">
                <h3 style="color:#d4af37;">الأصناف والأسعار مسجلة بالكامل وبصلاحية تعديل تامة</h3>
            </div>
        </div>

        <div id="cashiersTab" class="tab-content">
            <div class="card">
                <h3 style="color:#d4af37;">إضافة كاشير جديد وتأيين رمز السر الخاص به</h3>
            </div>
        </div>

        <div id="securityTab" class="tab-content">
            <div class="card">
                <h3 style="color:#d4af37;">تحديث كلمات المرور للنظام</h3>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
